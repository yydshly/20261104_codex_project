        <h1 id="project-overview-title">从看见盲区到用证据解释</h1>
        <p>发现自己还没想到的问题，知道下一步学什么，再用新情境检验自己能否说清判断依据。</p>
        <dl class="overview-metrics" aria-label="当前覆盖">
          <div><dt>社会板块</dt><dd>7</dd></div>
          <div><dt>行业门类</dt><dd>20</dd></div>
          <div><dt>代表性工作方向</dt><dd>60</dd></div>
          <div><dt>通用基础概念</dt><dd>14</dd></div>
        </dl>
      </header>

      <details class="overview-guide">
        <summary>查看研究引导长图 · 目标、能力、范围与多模型审核</summary>
        <figure>
          <a href="./assets/jianquan-overview.png" target="_blank" rel="noopener"><img src="./assets/jianquan-overview.png" width="2950" height="4590" loading="lazy" alt="见全研究引导图：三种认知状态、两种入口、学习路线、当前范围、内容依据与待试点的多模型审核"></a>
          <figcaption>沿用本次研究生成的 2950 × 4590 长图。点击图片查看高清原图，下面的交互总览可直接进入相关路线。</figcaption>

      <section class="overview-section" aria-labelledby="overview-goal">
        <h2 id="overview-goal"><span>01</span> 我们的理解与目标</h2>
        <ol class="overview-chain overview-goals">
          <li><h3>不知道自己不知道</h3><p>从熟悉的现象入手，发现判断中漏看的线索。</p></li>
          <li><h3>知道自己不知道</h3><p>说出缺的是概念、适用条件，还是能核对的证据。</p></li>
          <li><h3>知道自己知道</h3><p>换个场景，仍能解释判断、证据和结论的边界。</p></li>
        </ol>
      </section>

      <section class="overview-section" aria-labelledby="overview-method">
        <h2 id="overview-method"><span>02</span> 能力与学习原理</h2>
        <div class="overview-pair overview-entry">
          <div><h3>还没想好学什么</h3><p>逛<a href="#home">世界全景</a>，从社会板块和行业进入，或<a href="#study">先试一个身边的问题</a>。</p></div>
          <div><h3>已经有具体问题</h3><p><a href="#search">搜索现象、行业或概念</a>，找到工作方向和需要补的基础。</p></div>
        </div>
        <p class="overview-join">两种入口汇入同一条学习路线</p>
        <ol class="overview-chain overview-steps">
          <li><h3>先判断</h3><p>从直觉出发</p></li>
          <li><h3>看反馈</h3><p>找到漏看的条件</p></li>
          <li><h3>补基础</h3><p>读图解与参考成果</p></li>
          <li><h3>换场景再试</h3><p>用新证据重新判断</p></li>
          <li><h3>留下解释</h3><p>记录依据与待补内容</p></li>
        </ol>
      </section>

      <div class="overview-pair overview-scope-and-effects">
        <section class="overview-section" aria-labelledby="overview-scope">
          <h2 id="overview-scope"><span>03</span> 当前范围</h2>
          <p class="overview-bands">社会板块 → 行业门类 → 工作方向 → 技能与思维方式</p>
          <p>七个板块涵盖生存与资源、生产与交换、治理与协作、人口与照护、全球连接、文化与表达、知识与技术。</p>
          <p>20 个行业各有代表性案例。可深入 AI、信息组织、软件与计算、教育与传播四个专题领域。</p>
          <p>AI 展开大语言模型、智能体、RAG 与上下文工程。公司知识库助手串起检索、核验、评估与运行监控。</p>
          <p class="overview-note">子行业、岗位变体和专业知识仍按方向扩展。</p>
        </section>

        <section class="overview-section" aria-labelledby="overview-effects">
          <h2 id="overview-effects"><span>04</span> 三条已走通的学习路线</h2>
          <dl class="overview-cases">
            <div><dt><a href="#study/testing">软件测试</a></dt><dd>同样显示空列表，能用请求记录区分空结果与认证失败。</dd></div>
            <div><dt><a href="#study/quality">制造质检</a></dt><dd>抽查量和产品规格变化后，能重算比例并说出复查条件。</dd></div>
            <div><dt><a href="#study/assessment">教育反馈</a></dt><dd>同样选对答案，能用新作答区分谁讲清了理由。</dd></div>
          </dl>
          <p class="overview-note"><a href="#study/records">学习记录</a>保存在当前浏览器，可回看判断、反馈和自己的解释。</p>
        </section>
      </div>

      <section class="overview-section" aria-labelledby="overview-sources">
        <h2 id="overview-sources"><span>05</span> 内容依据与覆盖边界</h2>
        <dl class="overview-evidence">
          <div><dt>原始资料</dt><dd>行业门类采用国家统计局 A–T 分类。三条样板标明规范或专业资料支持的具体说法。</dd></div>
          <div><dt>教学归纳</dt><dd>社会板块、工作方向、学习顺序和知识关联由本站整理。</dd></div>
          <div><dt>虚构练习</dt><dd>案例记录、数据和示范答案为解释判断过程而编写。</dd></div>
        </dl>
        <p class="overview-note"><a href="#study/sources">查看内容出处与覆盖</a>。方向知识图待试点，按节点标出已有讲练、已有导览和出处待核。</p>
      </section>

      <section class="overview-section overview-review" aria-labelledby="overview-models">
        <div class="overview-review-heading"><h2 id="overview-models"><span>06</span> 多模型审核与互补</h2><span class="overview-badge">待试点</span></div>
        <p>把同一份路线草稿、关键说法和学习目标交给不同模型独立审稿。</p>
        <div class="overview-pair overview-review-roles">
          <div><h3>模型 A · 核对事实</h3><p>定位原文章节，检查说法、证据和适用条件。</p></div>
          <div><h3>模型 B · 查找缺口</h3><p>对照学习目标，找漏掉的基础、例外和换例练习。</p></div>
        </div>
        <p class="overview-review-flow">合并意见 → 对照原文与覆盖清单 → 修订并复核</p>
        <p>每条意见附位置、依据和改法，有分歧时标记为待复核。在三条路线的测试副本里加入已知事实错误、引用错位和内容缺口，记录各模型发现了什么、共同漏掉了什么，以及哪些是误报。</p>
      </section>
