<section id="rf-blackout-2031" aria-labelledby="bf-title">
  <header class="bf-header">
    <div class="bf-heading">
      <h1 id="bf-title">停电后的 20 分钟</h1>
      <p class="text-small text-muted">调度压力测试 · 十段道路 · 三个复电时限</p>
    </div>
    <div class="viz-row" role="group" aria-label="切换调度方式">
      <button class="btn" type="button" data-mode="manual" aria-pressed="true">逐步调度</button>
      <button class="btn" type="button" data-mode="auto" aria-pressed="false">2031 AI 协同</button>
    </div>
  </header>

  <p class="bf-value"><strong>AI 的价值</strong> 路断、车坏时，重新分配能用的车辆，兼顾优先级和各处复电时限。用同一组事故重跑，比较按时复电几处、需要亲手派车几次。</p>

  <div class="bf-controls bf-scenario">
    <label class="form-label" for="bf-scenario">压力场景</label>
    <select class="form-select" id="bf-scenario" data-scenario>
      <option value="compound">封路 + B 车故障</option>
      <option value="isolation">储能站被隔离</option>
      <option value="random">随机生成一组事故</option>
      <option value="free">自由设障</option>
    </select>
    <button class="btn" type="button" data-shuffle hidden>换一组</button>
    <button class="btn" type="button" data-compare disabled>同样事故切换模式</button>
    <span class="text-small text-muted" data-scenario-summary></span>
  </div>

  <div class="bf-world" data-world>
    <canvas data-canvas role="img" aria-label="可旋转的 3D 停电街区，包含三栋待供电建筑、两辆车和十段可选道路"></canvas>
    <div class="bf-hud">
      <div class="bf-hud-top">
        <span class="text-small">已用时间</span>
        <strong class="tabular-nums" data-clock>00:00 / 20:00</strong>
      </div>
      <div class="bf-hud-top">
        <span class="text-small">已恢复供电</span>
        <strong class="tabular-nums" data-restored>0 / 3</strong>
      </div>
      <div class="bf-hud-top">
        <span class="text-small">按时复电</span>
        <strong class="tabular-nums" data-on-time>0 / 3</strong>
      </div>
    </div>
    <button class="btn bf-pin" type="button" data-site="clinic" aria-pressed="true"><span data-dot></span><span data-pin-name>诊所</span></button>
    <button class="btn bf-pin" type="button" data-site="care" aria-pressed="false"><span data-dot></span><span data-pin-name>养老楼</span></button>
    <button class="btn bf-pin" type="button" data-site="shelter" aria-pressed="false"><span data-dot></span><span data-pin-name>避暑点</span></button>
    <button class="btn bf-pin" type="button" data-van="A" aria-pressed="true"><span data-van-dot></span>A 车</button>
    <button class="btn bf-pin" type="button" data-van="B" aria-pressed="false"><span data-van-dot></span>B 车</button>
    <div class="bf-error text-destructive" data-error role="alert" hidden></div>
  </div>

  <div class="bf-viewbar">
    <span class="text-small text-muted">拖动旋转 · 滚轮缩放 · 点击地图选路、选车、选建筑</span>
    <div class="viz-row bf-camera" role="group" aria-label="控制 3D 视角">
      <button class="btn btn-ghost" type="button" data-camera="left" aria-label="向左旋转">↶</button>
      <button class="btn btn-ghost" type="button" data-camera="right" aria-label="向右旋转">↷</button>
      <button class="btn btn-ghost" type="button" data-camera="in" aria-label="放大">＋</button>
      <button class="btn btn-ghost" type="button" data-camera="out" aria-label="缩小">−</button>
      <button class="btn btn-ghost" type="button" data-camera="reset">全景</button>
    </div>
  </div>

  <div class="bf-controls" aria-label="设置事故">
    <label class="form-label" for="bf-road">道路</label>
    <select class="form-select" id="bf-road" data-road-select></select>
    <button class="btn" type="button" data-road aria-pressed="false">封路</button>
    <button class="btn" type="button" data-failure aria-pressed="false">模拟 A 车故障</button>
  </div>

  <div class="bf-console">
    <div class="bf-actions" data-manual>
      <button class="btn btn-primary" type="button" data-dispatch>A 车出发 → 诊所</button>
    </div>
    <div class="bf-actions" data-auto hidden>
      <button class="btn btn-primary" type="button" data-delegate>委托 AI 恢复供电</button>
      <button class="btn" type="button" data-priority>优先诊所</button>
      <label class="form-check form-switch">
        <input class="form-check-input" type="checkbox" data-permission>
        <span class="form-check-label">授权 AI 调用 B 车</span>
      </label>
    </div>
    <div class="bf-actions bf-run">
      <button class="btn" type="button" data-voice aria-expanded="false" aria-controls="bf-narration">听讲解</button>
      <button class="btn" type="button" data-pause disabled>暂停</button>
      <button class="btn" type="button" data-restart>重跑</button>
    </div>
  </div>
  <section class="bf-narration" id="bf-narration" data-narration aria-label="语音讲解字幕" hidden>
    <div>
      <span class="text-small text-muted" data-voice-status>MiniMax 讲解字幕</span>
      <p data-caption></p>
    </div>
    <button class="btn btn-ghost" type="button" data-replay>重听</button>
    <audio data-narration-audio preload="none" hidden></audio>
  </section>
  <p class="bf-detail" data-detail aria-live="polite"></p>
  <p class="bf-plan text-small" data-plan hidden></p>
  <div class="bf-comparison" data-comparison hidden>
    <h2>同场对照</h2>
    <p data-baseline></p>
    <p data-current-result></p>
    <p class="text-small text-muted" data-comparison-note></p>
  </div>

  <div class="bf-record">
    <h2>调度记录</h2>
    <ol data-events aria-live="polite" aria-relevant="additions text"></ol>
  </div>
  <p class="text-small text-muted" data-note>诊所 8 分钟 · 养老楼 11 分钟 · 避暑点 14 分钟。2031 档为规则推演。</p>
</section>

<style>
  #rf-blackout-2031 {display:grid;gap:calc(var(--font-size-base, 14px) * .65);color:var(--foreground);min-width:0}
  #rf-blackout-2031 [hidden] {display:none !important}
  #rf-blackout-2031 .bf-header,
  #rf-blackout-2031 .bf-viewbar,
  #rf-blackout-2031 .bf-console {display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem 1rem}
  #rf-blackout-2031 .bf-heading {display:grid;gap:.25rem}
  #rf-blackout-2031 .bf-value strong {font-weight:500;margin-inline-end:.5rem}

  #rf-blackout-2031 .bf-controls .form-select {width:auto;max-width:100%}
  #rf-blackout-2031 .bf-controls .form-label {margin:0}
  #rf-blackout-2031 .bf-comparison {display:grid;gap:.25rem}
  #rf-blackout-2031 [data-failed="true"] [data-van-dot] {background:var(--red,var(--foreground))}
  #rf-blackout-2031 .bf-world {position:relative;height:clamp(365px,55vw,470px);overflow:hidden;isolation:isolate}
  #rf-blackout-2031 canvas {width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #rf-blackout-2031 canvas:active {cursor:grabbing}
  #rf-blackout-2031 .bf-hud {position:absolute;top:.75rem;left:.75rem;display:grid;gap:.25rem;pointer-events:none}
  #rf-blackout-2031 .bf-hud-top {display:flex;flex-wrap:wrap;gap:.25rem .6rem;align-items:baseline}
  #rf-blackout-2031 .bf-hud strong {font-weight:500}
  #rf-blackout-2031 .bf-pin {position:absolute;display:flex;gap:.35rem;align-items:center;white-space:nowrap;transform:translate(-50%,-50%);z-index:2}
  #rf-blackout-2031 [data-dot], #rf-blackout-2031 [data-van-dot] {width:.45rem;height:.45rem;border-radius:50%;background:var(--orange,var(--muted-foreground));flex:none}
  #rf-blackout-2031 [data-powered="true"] [data-dot] {background:var(--green,var(--foreground))}
  #rf-blackout-2031 [data-van="A"] [data-van-dot] {background:var(--blue,var(--foreground))}
  #rf-blackout-2031 [data-van="B"] [data-van-dot] {background:var(--purple,var(--foreground))}
  #rf-blackout-2031 .bf-camera {gap:.15rem}
  #rf-blackout-2031 .bf-actions {display:flex;align-items:center;flex-wrap:wrap;gap:.5rem}
  #rf-blackout-2031 .bf-detail {min-height:1.5em}
  #rf-blackout-2031 .bf-narration {display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem}
  #rf-blackout-2031 .bf-narration p {margin:.2rem 0 0}
  #rf-blackout-2031 .bf-narration [data-replay] {flex:none}
  #rf-blackout-2031 .bf-record {display:grid;gap:.35rem}
  #rf-blackout-2031 .bf-record ol {margin:0;padding:0;list-style:none;display:grid;gap:.25rem}
  #rf-blackout-2031 .bf-record li {display:grid;grid-template-columns:3.1em minmax(0,1fr);gap:.35rem}
  #rf-blackout-2031 .bf-error {position:absolute;inset:40% .75rem auto;text-align:center}
  @media (min-width:800px) {
    #rf-blackout-2031:has([data-narration]:not([hidden])) .bf-world {height:clamp(350px,52vw,420px)}
  }
  @media (max-width:560px) {
    #rf-blackout-2031 .bf-world {height:350px}
    #rf-blackout-2031 .bf-hud {top:0;left:0;right:0;display:flex;justify-content:space-between;gap:.5rem}
    #rf-blackout-2031 .bf-hud-top {display:grid;gap:.15rem}
    #rf-blackout-2031 .bf-console {align-items:flex-start}
  }
</style>

<script>
(() => {
  'use strict';
function createBlackoutSim(mode) {
  const points = {
    D: [-9, 6], W: [-9, 0], C: [0, 0], E: [9, 0], NW: [-9, -6],
    N: [0, -6], NE: [9, -6], M: [0, 6], S: [9, 6],
  };
  const roads = [
    ['D', 'W', 6, '西南支路'], ['W', 'C', 9, '西段主路'], ['C', 'E', 9, '中央主路'],
    ['W', 'NW', 6, '西北支路'], ['NW', 'N', 9, '北环西段'], ['N', 'NE', 9, '北环东段'],
    ['NE', 'E', 6, '东北支路'], ['E', 'S', 6, '东南支路'], ['D', 'M', 9, '南环西段'],
    ['M', 'S', 12, '南环东段'],
  ].map(([from, to, cost, name]) => ({ id: from + to, from, to, cost, name }));
  const roadBetween = new Map();
  for (const road of roads) {
    roadBetween.set(road.from + ':' + road.to, road);
    roadBetween.set(road.to + ':' + road.from, road);
  }
  const roadFor = (from, to) => roadBetween.get(from + ':' + to);
  const closed = new Set();
  const routeCache = new Map();
  const sites = {
    clinic: { name: '诊所', node: 'E', due: 8, powered: false, by: null, at: null, source: null },
    care: { name: '养老楼', node: 'NW', due: 11, powered: false, by: null, at: null, source: null },
    shelter: { name: '避暑点', node: 'S', due: 14, powered: false, by: null, at: null, source: null },
  };
  const siteIds = Object.keys(sites);
  const state = {
    mode, elapsed: 0, deadline: 20, completedAt: null, blocked: false,
    roads: roads.map(({ id, name }) => ({ id, name })), closedRoads: [],
    delegated: false, permission: false, priority: 'clinic', replans: 0,
    manualDispatches: 0, aiDispatches: 0, planNote: '', unreachable: [],
    sites, events: [],
    vans: ['A', 'B'].map((id, index) => ({
      id, x: points.D[0], z: points.D[1], heading: Math.PI / 2,
      status: 'idle', target: null, path: [], node: 'D', route: [], leg: null,
      carrying: true, speed: 5.8 - index * 0.4, readyAt: 0, retreating: false,
      source: null, routeReason: null, failed: false,
    })),
  };
  const reloadDelay = 0.45;
  const finished = () => state.completedAt !== null || state.elapsed >= state.deadline;
  const allowed = (van) => state.mode === 'manual' || van.id === 'A' || state.permission;
  const usable = (van) => allowed(van) && !van.failed;
  const assigned = (siteId, except) =>
    state.vans.some((van) => van !== except && van.status === 'moving' && van.target === siteId);

  function note(text) {
    state.events.unshift({ at: state.elapsed, text });
    if (state.events.length > 32) state.events.pop();
  }

  function shortest(start, finish) {
    if (!points[start] || !points[finish]) return null;
    const key = start + ':' + finish;
    if (routeCache.has(key)) return routeCache.get(key);
    const costs = { [start]: 0 };
    const previous = {};
    const remaining = new Set(Object.keys(points));
    let result = null;
    while (remaining.size) {
      let node = null;
      let bestCost = Infinity;
      for (const candidate of remaining) {
        if ((costs[candidate] ?? Infinity) < bestCost) {
          node = candidate;
          bestCost = costs[candidate];
        }
      }
      if (node === null) break;
      if (node === finish) {
        const nodes = [finish];
        while (nodes[0] !== start) nodes.unshift(previous[nodes[0]]);
        result = { nodes, cost: bestCost };
        break;
      }
      remaining.delete(node);
      for (const road of roads) {
        if (closed.has(road.id)) continue;
        const next = road.from === node ? road.to : road.to === node ? road.from : null;
        if (!remaining.has(next)) continue;
        const cost = bestCost + road.cost;
        if (cost < (costs[next] ?? Infinity)) {
          costs[next] = cost;
          previous[next] = node;
        }
      }
    }
    routeCache.set(key, result);
    return result;
  }

  function routeFromVan(van, finish) {
    if (!van.leg) return shortest(van.node, finish);
    const { from, to, progress } = van.leg;
    const road = roadFor(from, to);
    const back = shortest(from, finish);
    const backwards = back && { nodes: back.nodes, cost: back.cost + road.cost * progress };
    if (closed.has(road.id)) return backwards;
    const ahead = shortest(to, finish);
    const forwards = ahead && { nodes: ahead.nodes, cost: ahead.cost + road.cost * (1 - progress) };
    if (!forwards || (backwards && backwards.cost < forwards.cost)) return backwards;
    return forwards;
  }

  function syncPath(van) {
    if (van.failed || (!van.retreating && van.status !== 'moving' && van.status !== 'returning')) {
      van.path = [];
      return;
    }
    const nextNodes = van.leg ? [van.leg.end, ...van.route] : van.route;
    van.path = [[van.x, van.z], ...nextNodes.map((node) => points[node])];
  }

  function park(van, safeRetreat) {
    van.status = 'stopped';
    van.route = [];
    van.retreating = Boolean(safeRetreat && van.leg && closed.has(roadFor(van.leg.from, van.leg.to).id));
    if (van.retreating) van.leg.end = van.leg.from;
    syncPath(van);
  }

  function startTrip(van, destination, status) {
    const plan = routeFromVan(van, destination);
    if (!plan) {
      park(van, true);
      return false;
    }
    van.status = status;
    van.retreating = false;
    if (van.leg) van.leg.end = plan.nodes[0];
    van.route = plan.nodes.slice(1);
    syncPath(van);
    return true;
  }

  function estimate(vanId, siteId) {
    const van = state.vans.find(({ id }) => id === vanId);
    const site = sites[siteId];
    if (!van || van.failed || !site || site.powered) return null;
    if (van.carrying) {
      const route = routeFromVan(van, site.node);
      return route ? route.cost / van.speed : null;
    }
    const toDepot = routeFromVan(van, 'D');
    const delivery = shortest('D', site.node);
    if (!toDepot || !delivery) return null;
    return (toDepot.cost + delivery.cost) / van.speed + Math.max(0, van.readyAt - state.elapsed);
  }

  function send(van, siteId, source) {
    const previous = van.status === 'moving' ? van.target : null;
    if (!startTrip(van, sites[siteId].node, 'moving')) return false;
    van.target = siteId;
    van.source = source;
    van.routeReason = source === 'AI'
      ? '按预计到达时间、供电时限和优先级比较可行排程'
      : closed.size ? '按当前可通行路网计算路线' : '采用预计用时最短的路线';
    if (source === 'AI') state.aiDispatches += 1;
    else state.manualDispatches += 1;
    const action = previous && previous !== siteId
      ? `${source}将 ${van.id} 车从${sites[previous].name}改派至${sites[siteId].name}`
      : `${source}派 ${van.id} 车前往${sites[siteId].name}`;
    note(`${action}，预计 ${estimate(van.id, siteId).toFixed(1)} 分钟抵达。`);
    return true;
  }

  function returnToDepot(van) {
    van.target = null;
    if (startTrip(van, 'D', 'returning')) note(`${van.id} 车返回储能站补装电源。`);
    else note(`${van.id} 车暂时无法返回储能站，等待道路恢复。`);
  }

  function tripRemaining(van) {
    const nodes = van.leg ? [van.leg.end, ...van.route] : [van.node, ...van.route];
    let distance = 0;
    if (van.leg) {
      const { from, to, end, progress } = van.leg;
      distance += roadFor(from, to).cost * (end === to ? 1 - progress : progress);
    }
    for (let index = 1; index < nodes.length; index++) {
      distance += roadFor(nodes[index - 1], nodes[index]).cost;
    }
    return distance / van.speed;
  }

  function arrivalAfter(van, previous, siteId) {
    if (!previous) {
      const eta = estimate(van.id, siteId);
      return eta === null ? null : state.elapsed + eta;
    }
    const toDepot = shortest(sites[previous.id].node, 'D');
    const delivery = shortest('D', sites[siteId].node);
    return toDepot && delivery
      ? previous.at + reloadDelay + (toDepot.cost + delivery.cost) / van.speed : null;
  }

  function schedule(divert = false) {
    state.unreachable = siteIds.filter((id) => !sites[id].powered &&
      !state.vans.some((van) => usable(van) && estimate(van.id, id) !== null));
    if (!state.delegated || finished()) return;
    const pending = siteIds.filter((id) => !sites[id].powered);
    const fleet = state.vans.filter(usable);
    if (!fleet.length) {
      state.planNote = '当前没有获授权且可用的车辆。恢复车辆或增加授权后可继续。';
      return;
    }
    const plans = fleet.map((van) => {
      const fixed = van.status === 'moving' && !divert;
      return {
        van,
        fixed,
        stops: fixed ? [{ id: van.target, at: state.elapsed + tripRemaining(van) }] : [],
      };
    });
    const arrivals = {};
    for (const plan of plans) {
      if (plan.fixed) arrivals[plan.stops[0].id] = plan.stops[0].at;
    }
    const unassigned = pending.filter((id) => arrivals[id] === undefined);
    const outsideHorizon = state.deadline + 60;
    let best = null;
    let bestScore = null;

    // Only three destinations and two vehicles. Compare every feasible ordering,
    // including a depot refill before each additional delivery.
    function search(waiting) {
      const priorityEta = pending.includes(state.priority)
        ? arrivals[state.priority] ?? outsideHorizon : 0;
      const dueMissed = pending.filter((id) => (arrivals[id] ?? outsideHorizon) > sites[id].due).length;
      const horizonMissed = pending.filter((id) => (arrivals[id] ?? outsideHorizon) > state.deadline).length;
      const totalArrival = pending.reduce((sum, id) => sum + (arrivals[id] ?? outsideHorizon), 0);
      const score = [priorityEta > sites[state.priority].due ? 1 : 0, dueMissed, horizonMissed, priorityEta, totalArrival];
      const difference = bestScore ? score.findIndex((value, index) => value !== bestScore[index]) : -1;
      if (!bestScore || (difference !== -1 && score[difference] < bestScore[difference])) {
        bestScore = score;
        best = plans.map((plan) => ({ ...plan, stops: [...plan.stops] }));
      }
      for (const id of waiting) {
        for (const plan of plans) {
          const at = arrivalAfter(plan.van, plan.stops.at(-1), id);
          if (at === null) continue;
          arrivals[id] = at;
          plan.stops.push({ id, at });
          search(waiting.filter((item) => item !== id));
          plan.stops.pop();
          delete arrivals[id];
        }
      }
    }

    search(unassigned);
    const updates = best.filter(({ van, stops, fixed }) =>
      !fixed && van.carrying && stops.length && (van.status !== 'moving' || van.target !== stops[0].id));
    if (divert) {
      for (const { van, stops } of best) {
        if (van.status === 'moving' && !stops.length) {
          van.target = null;
          park(van, true);
        }
      }
    }
    for (const { van, stops } of updates) send(van, stops[0].id, 'AI');

    const projected = new Map(best.flatMap(({ stops }) => stops.map((stop) => [stop.id, stop.at])));
    const missing = pending.filter((id) => !projected.has(id));
    const late = pending.filter((id) => projected.has(id) && projected.get(id) > sites[id].due);
    const assignments = best.filter(({ stops }) => stops.length).map(({ van, stops }) =>
      `${van.id} 车${van.carrying ? '先去' : '补给后前往'}${sites[stops[0].id].name}，预计第 ${stops[0].at.toFixed(1)} 分钟到达`);
    const blockers = missing.length
      ? `${missing.map((id) => sites[id].name).join('、')}暂无可行路线或补给路径` : '';
    const tradeoff = late.length
      ? `${late.map((id) => sites[id].name).join('、')}预计超过各自时限` : '';
    state.planNote = [...assignments, blockers, tradeoff].filter(Boolean).join('。') + '。';
  }

  function finishTrip(van) {
    if (van.retreating) {
      van.retreating = false;
      note(`${van.id} 车已退回安全路口。`);
      return;
    }
    if (van.status === 'returning') {
      van.status = 'idle';
      van.carrying = true;
      note(`${van.id} 车补装完毕，可以再次派出。`);
      return;
    }
    const site = sites[van.target];
    site.powered = true;
    site.by = van.id;
    site.at = state.elapsed;
    site.source = van.source;
    site.reason = van.routeReason;
    van.target = null;
    van.status = 'done';
    van.carrying = false;
    van.readyAt = state.elapsed + reloadDelay;
    note(`${van.id} 车为${site.name}接上电源${site.at > site.due ? '，超过该站点的时限' : '，在该站点的时限内'}。`);
    if (siteIds.every((id) => sites[id].powered)) {
      state.completedAt = state.elapsed;
      state.planNote = '三处已恢复供电，可按站点核对到达时间和供电时限。';
      note('三个地点均已恢复供电。');
    }
  }

  function advance(van, dt) {
    let distance = van.speed * dt;
    let arrived = false;
    while (distance > 0.0001) {
      if (!van.leg) {
        const next = van.route.shift();
        if (!next) {
          finishTrip(van);
          arrived = true;
          break;
        }
        van.leg = { from: van.node, to: next, end: next, progress: 0 };
        van.node = null;
      }
      const leg = van.leg;
      const [startX, startZ] = points[leg.from];
      const [endX, endZ] = points[leg.to];
      const direction = leg.end === leg.to ? 1 : -1;
      const remaining = direction === 1 ? 1 - leg.progress : leg.progress;
      const weight = roadFor(leg.from, leg.to).cost;
      const used = Math.min(distance, remaining * weight);
      leg.progress += direction * used / weight;
      van.x = startX + (endX - startX) * leg.progress;
      van.z = startZ + (endZ - startZ) * leg.progress;
      van.heading = Math.atan2((endX - startX) * direction, (endZ - startZ) * direction);
      distance -= used;
      if (remaining - used / weight < 0.000001) {
        van.node = leg.end;
        [van.x, van.z] = points[van.node];
        van.leg = null;
        if (!van.route.length) {
          finishTrip(van);
          arrived = true;
          break;
        }
      }
    }
    syncPath(van);
    return arrived;
  }

  function tick(dt) {
    if (!Number.isFinite(dt) || dt <= 0) return;
    while (dt > 1e-9 && !finished()) {
      const step = Math.min(dt, 0.1, state.deadline - state.elapsed);
      state.elapsed += step;
      dt -= step;
      let arrived = false;
      for (const van of state.vans) {
        if (!usable(van)) continue;
        if (van.status === 'done' && state.elapsed >= van.readyAt) returnToDepot(van);
        if (van.retreating || van.status === 'moving' || van.status === 'returning') {
          if (advance(van, step)) arrived = true;
        }
      }
      if (arrived) schedule();
      if (state.elapsed >= state.deadline && state.completedAt === null) {
        note('已到 20 分钟，仍有地点需要供电。');
      }
    }
  }

  function dispatch(vanId, siteId) {
    if (state.mode !== 'manual' || finished()) return false;
    const van = state.vans.find(({ id }) => id === vanId);
    if (!van || van.failed || !sites[siteId]) return false;
    if (sites[siteId].powered || assigned(siteId, van)) {
      note(`${sites[siteId].name}已接电或已有车前往，请选择其他地点。`);
      return false;
    }
    if (!van.carrying) {
      note(`${van.id} 车需要回储能站补装电源。`);
      return false;
    }
    if (van.status === 'moving' && van.target === siteId) return false;
    const eta = estimate(vanId, siteId);
    if (eta === null) {
      note(`${vanId} 车到${sites[siteId].name}暂无可通行路线。`);
      return false;
    }
    state.planNote = `${vanId} 车预计第 ${(state.elapsed + eta).toFixed(1)} 分钟抵达${sites[siteId].name}${state.elapsed + eta > sites[siteId].due ? '，超过站点时限' : ''}。`;
    return send(van, siteId, '你');
  }

  function affectsTrip(van, road) {
    if (van.leg && roadFor(van.leg.from, van.leg.to) === road) return true;
    const nodes = [van.leg ? van.leg.end : van.node, ...van.route];
    return nodes.some((node, index) => roadFor(node, nodes[index + 1]) === road);
  }

  function toggleRoad(id = 'CE') {
    const road = roads.find((item) => item.id === id);
    if (!road || finished()) return null;
    const closing = !closed.has(id);
    if (closing) closed.add(id);
    else closed.delete(id);
    state.closedRoads = [...closed];
    state.blocked = closed.size > 0;
    routeCache.clear();
    note(`${road.name}${closing ? '封闭' : '已开放'}。`);
    state.planNote = `${road.name}${closing ? '封闭' : '已开放'}。`;
    for (const van of state.vans) {
      if (!usable(van)) continue;
      if (!closing) {
        if (van.status === 'stopped' && !van.carrying && routeFromVan(van, 'D')) returnToDepot(van);
        if (state.delegated && (van.status === 'moving' || van.status === 'returning')) {
          const destination = van.status === 'returning' ? 'D' : sites[van.target].node;
          const better = routeFromVan(van, destination);
          if (better && better.cost / van.speed + 0.001 < tripRemaining(van)) {
            startTrip(van, destination, van.status);
            van.routeReason = `${road.name}开放后采用更短的可行路线`;
            state.replans += 1;
            note(`AI 为 ${van.id} 车改走开放后的较短路线。`);
          }
        }
        continue;
      }
      if ((van.status !== 'moving' && van.status !== 'returning') || !affectsTrip(van, road)) continue;
      if (van.status === 'returning') {
        if (startTrip(van, 'D', 'returning')) {
          if (state.delegated) state.replans += 1;
          note(`${van.id} 车绕行返回储能站。`);
        } else note(`${van.id} 车无法返回储能站，等待道路恢复。`);
      } else if (state.delegated) {
        if (startTrip(van, sites[van.target].node, 'moving')) {
          state.replans += 1;
          van.routeReason = `${road.name}封闭后重新规划`;
          note(`AI 为 ${van.id} 车重算路线并绕行，预计 ${estimate(van.id, van.target).toFixed(1)} 分钟抵达。`);
        } else {
          note(`${van.id} 车到${sites[van.target].name}暂无可行路线，AI 重新检查车辆分工。`);
        }
      } else {
        park(van, true);
        const eta = estimate(van.id, van.target);
        state.planNote = `${van.id} 车因${road.name}封闭暂停。${eta === null ? '当前没有可通行的绕行路线。' : '确认路线后可重新派车。'}`;
        note(state.planNote);
      }
    }
    schedule();
    return closing;
  }

  function setVanFailure(id, failed) {
    const van = state.vans.find((item) => item.id === id);
    if (!van || finished() || van.failed === Boolean(failed)) return false;
    van.failed = Boolean(failed);
    let lostTarget = null;
    if (van.failed) {
      lostTarget = van.target;
      van.target = null;
      park(van, false);
      note(`${id} 车故障停驶${lostTarget ? `，${sites[lostTarget].name}等待重新分配` : ''}。`);
    } else {
      note(`${id} 车恢复可用。`);
      if (usable(van) && !van.carrying) returnToDepot(van);
      else if (usable(van) && van.leg) park(van, true);
    }
    state.planNote = `${id} 车${van.failed ? '故障停驶' : '恢复可用'}。`;
    schedule(lostTarget === state.priority);
    return true;
  }

  function delegate() {
    if (state.mode !== 'auto' || state.delegated || finished()) return false;
    state.delegated = true;
    note(state.permission ? 'AI 已接手，获准调度两辆车。' : 'AI 已接手，可调度 A 车，B 车等待授权。');
    schedule();
    return true;
  }

  function setPermission(permission) {
    if (state.mode !== 'auto' || finished() || state.permission === Boolean(permission)) return false;
    state.permission = Boolean(permission);
    note(state.permission ? '已授权 AI 调度 B 车。' : '已收回 B 车的调度权限。');
    const van = state.vans[1];
    const lostPriority = !state.permission && van.target === state.priority;
    if (!state.permission && !van.failed && (van.status === 'moving' || van.status === 'returning' || van.retreating)) {
      van.target = null;
      park(van, false);
      note('B 车暂停，原任务重新分配。');
    }
    if (state.permission && !van.failed && van.status === 'stopped' && !van.carrying) returnToDepot(van);
    schedule(lostPriority);
    return true;
  }

  function setPriority(siteId) {
    if (!sites[siteId] || sites[siteId].powered || finished() || siteId === state.priority) return false;
    state.priority = siteId;
    note(`优先供电地点改为${sites[siteId].name}。`);
    schedule(true);
    return true;
  }

  note('高温导致街区停电，三个地点等待接入移动电源。');
  return { state, tick, dispatch, toggleRoad, setVanFailure, delegate, setPermission, setPriority, estimate };
}

function createBlackoutScene(canvas, onPick, palette = {}) {

  } catch {

  const purple = color('purple', '#a08ee0');
  const green = color('green', '#63dcb2');
  const amber = color('orange', '#f4b86c');
  const red = color('red', '#ff847e');

  renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  const camera = new T.OrthographicCamera(-20, 20, 15, -15, 0.1, 150);

  sun.shadow.normalBias = 0.055;
  scene.add(sun);
  const rim = new T.DirectionalLight(blue, 1.15);
  rim.position.set(12, 8, -16);
  scene.add(rim);

  const geometryCache = new Map();
  const material = (value, props = {}) => new T.MeshStandardMaterial({ color: value, roughness: 0.83, ...props });
  const base = material(mix(dark, blue, 0.075));
  const top = material(mix(dark, light, 0.19));
  const roadMaterial = material(mix(dark, light, 0.062));
  const sidewalk = material(mix(dark, light, 0.25));
  const curb = material(mix(dark, light, 0.34));
  const roadPaint = material(mix(dark, light, 0.50));
  const roof = material(mix(slate, light, 0.23));
  const structural = material(mix(slate, light, 0.12));
  const glass = material(mutedWindows, { roughness: 0.4 });
  const greenery = material(mix(dark, green, 0.25));
  const foliage = material(mix(dark, green, 0.38));
  const trunks = material(mix(dark, amber, 0.13));
  const rubber = material(mix(dark, ink, 0.02));
  const warmLamp = material(mix(amber, light, 0.6), { emissive: amber, emissiveIntensity: 0.7 });
  const warningLamp = material(red, { emissive: red, emissiveIntensity: 0.62 });
  const paleMarker = material(mix(amber, light, 0.48));
  const selectedLane = new T.MeshBasicMaterial({ color: blue, transparent: true, opacity: 0.22, depthWrite: false });
  const selectedLine = new T.MeshBasicMaterial({ color: mix(blue, light, 0.22) });
  const blockedLane = new T.MeshBasicMaterial({ color: red, transparent: true, opacity: 0.25, depthWrite: false });
  const blockedMark = new T.MeshBasicMaterial({ color: mix(red, light, 0.08), transparent: true, opacity: 0.64, depthWrite: false });
  const barrierFrame = material(mix(dark, red, 0.42), { roughness: 0.56 });
  const barrierPanel = material(red, { emissive: red, emissiveIntensity: 0.39, roughness: 0.4 });
  const powerCable = new T.MeshBasicMaterial({ color: mix(green, light, 0.18), transparent: true, opacity: 0.84, depthWrite: false });

  const nodes = {
    D: [-9, 6], W: [-9, 0], C: [0, 0], E: [9, 0],
    NW: [-9, -6], N: [0, -6], NE: [9, -6], M: [0, 6], S: [9, 6]
  };
  const links = [
    ['D', 'W'], ['W', 'C'], ['C', 'E'], ['W', 'NW'], ['NW', 'N'],
    ['N', 'NE'], ['NE', 'E'], ['E', 'S'], ['D', 'M'], ['M', 'S']
  ];
  const anchors = new Map();
  const pickRoots = [];
  const sites = {};
  const vans = {};
  const roadViews = {};

  function box(parent, x, y, z, width, height, depth, mat, shadows = false) {
    const key = [width, height, depth].join(',');

  const initialTilt = 0.54;
  let azimuth = 0.55;
  let tilt = initialTilt;
  let scale = 1;
  let width = 0;
  let height = 0;
  let aspect = 1;
  let dirtyCamera = true;
  let previousWidth = 0;
  let previousHeight = 0;
  let lastView = '';
  const projectPoint = new T.Vector3();
  const ray = new T.Raycaster();
  const pointer = new T.Vector2();
  const cameraFocus = new T.Vector3(0, 0.72, 0);

  function syncCamera() {
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    if (!width || !height) return false;
    if (width !== previousWidth || height !== previousHeight) {
      renderer.setSize(width, height, false);
      previousWidth = width;
      previousHeight = height;
      aspect = width / height;
      dirtyCamera = true;
    }
    if (dirtyCamera) {
      const span = Math.max(29.8, 39.5 / aspect) * scale;
      camera.top = span / 2;
      camera.bottom = -span / 2;
      camera.left = -span * aspect / 2;
      camera.right = span * aspect / 2;
      camera.position.set(Math.sin(azimuth) * Math.sin(tilt) * 43, Math.cos(tilt) * 43, Math.cos(azimuth) * Math.sin(tilt) * 43);
      camera.lookAt(cameraFocus);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      dirtyCamera = false;
    }
    return true;
  }

  function orbit(dx, dy) {
    azimuth -= dx * 0.009;
    tilt = Math.max(0.42, Math.min(1.24, tilt + dy * 0.006));
    dirtyCamera = true;
  }

  function zoom(delta) {
    scale = Math.max(0.49, Math.min(1.66, scale * Math.exp(delta * 0.0014)));
    dirtyCamera = true;
  }

  function resetCamera() {
    azimuth = 0.55;
    tilt = initialTilt;
    scale = 1;
    dirtyCamera = true;
  }

  function updateRoute(van, path, x, z, selected) {
    const points = [[x, z], ...(path || [])];
    for (let i = 0; i < points.length - 1; i++) {
      const [a, b] = points[i];
      const [c, d] = points[i + 1];
      const length = Math.hypot(c - a, d - b);
      if (!van.segments[i]) {
        const segment = new T.Mesh(new T.BoxGeometry(1, 0.019, 0.15), van.routeMaterial);
        van.route.add(segment);
        van.segments[i] = segment;
      }
      const segment = van.segments[i];
      segment.visible = length > 0.02;
      segment.scale.x = length;
      segment.scale.z = selected ? 1.65 : 1;
      segment.position.set((a + c) / 2, 0.084, (b + d) / 2);
      segment.rotation.y = -Math.atan2(d - b, c - a);
    }
    for (let i = points.length - 1; i < van.segments.length; i++) van.segments[i].visible = false;
    van.routeMaterial.opacity = selected ? 0.96 : 0.76;
  }

  function draw(view) {
    const cameraChanged = dirtyCamera || width !== canvas.clientWidth || height !== canvas.clientHeight;
    if (!syncCamera()) return false;
    const now = performance.now();
    const selected = view.selection;
    const closed = new Set(view.closedRoads ?? (view.blocked ? ['CE'] : []));
    const fingerprint = JSON.stringify([
      view.elapsed, [...closed], selected, Object.values(view.sites).map((site) => [site.powered, site.due]),
      view.vans.map(({ x, z, heading, path, failed }) => [x, z, heading, path, failed]),
    ]);
    const restoreAnimation = Object.values(sites).some((site) => site.litAt !== null && now - site.litAt < 1250);
    if (!cameraChanged && !restoreAnimation && fingerprint === lastView) return false;
    lastView = fingerprint;
    for (const [id, road] of Object.entries(roadViews)) {
      road.closure.visible = closed.has(id);
      road.highlight.visible = selected?.kind === 'road' && selected.id === id;
    }
    for (const [id, building] of Object.entries(sites)) {
      const site = view.sites[id];
      const powered = Boolean(site?.powered);
      if (building.lastPowered !== powered) building.litAt = powered ? now : null;
      building.lastPowered = powered;
      building.windows.color.copy(powered ? litWindows : mutedWindows);
      building.windows.emissive.copy(powered ? amber : dark);
      building.windows.emissiveIntensity = powered ? 1.43 : 0.0;
      building.emergency.material = powered ? warmLamp : warningLamp;
      building.cable.visible = powered;
      const active = selected?.kind === 'site' && selected.id === id;
      const age = building.litAt === null ? Infinity : now - building.litAt;
      const timeLeft = (site?.due ?? Infinity) - view.elapsed;
      const atRisk = !powered && timeLeft < 2;
      building.ring.visible = active || powered || atRisk;
      building.ring.material.color.copy(powered ? green : timeLeft <= 0 ? red : atRisk ? amber : building.tint);
      building.ring.material.opacity = active ? 0.92 : atRisk ? 0.63 : 0.59;
      building.pulse.visible = age < 1200;
      if (building.pulse.visible) {
        building.pulse.scale.setScalar(1 + 0.72 * age / 1200);
        building.pulse.material.opacity = 0.82 * (1 - age / 1200);
      }
    }
    const close = view.vans.length === 2 && Math.hypot(view.vans[0].x - view.vans[1].x, view.vans[0].z - view.vans[1].z) < 0.48;
    for (const record of view.vans) {
      const van = vans[record.id];
      if (!van) continue;
      const offset = close ? (record.id === 'A' ? -0.39 : 0.39) : 0;
      const x = record.x + offset;
      van.model.position.set(x, 0.06, record.z);
      van.model.rotation.y = record.heading || 0;
      const active = selected?.kind === 'van' && selected.id === record.id;
      van.ring.visible = active || record.failed;
      van.ring.material.color.copy(record.failed ? red : van.tone);
      van.alert.visible = Boolean(record.failed);
      van.stripe.color.copy(record.failed ? red : van.tone);
      van.stripe.emissive.copy(record.failed ? red : van.tone);
      updateRoute(van, record.failed ? [] : record.path, x, record.z, active);
    }
    renderer.render(scene, camera);
    return true;
  }

  function project(kind, id) {
    const anchor = anchors.get(kind + ':' + (kind === 'depot' ? 'depot' : id));
    if (!anchor || !width || !height) return { x: 0, y: 0, visible: false };
    projectPoint.copy(anchor()).project(camera);
    return {
      x: (projectPoint.x + 1) * width / 2,
      y: (1 - projectPoint.y) * height / 2,
      visible: Math.abs(projectPoint.x) < 0.94 && Math.abs(projectPoint.y) < 0.89 && Math.abs(projectPoint.z) < 1
    };
  }

  let outcomeRecorded = false;
  let scene;
  let userInteracted = false;
  let narrationEnabled = false;
  let activeCue = null;
  let pendingCue = null;
  let playbackVersion = 0;
  let restoredNarrated = false;

  function scenarioPlan(kind) {
    const road = (at, id, active = true) => ({ at, type: 'road', id, active });
    const fault = (at, id, active = true) => ({ at, type: 'van', id, active });
    if (kind === 'compound') return [road(2, 'CE'), fault(4, 'B'), fault(9, 'B', false)];
    if (kind === 'isolation') return [road(1.5, 'DW'), road(1.5, 'DM'), road(7, 'DW', false)];
    if (kind === 'random') {
      const roads = sim.state.roads.map(({ id }) => id);
      const first = roads.splice(Math.floor(Math.random() * roads.length), 1)[0];
      const second = roads[Math.floor(Math.random() * roads.length)];
      const van = Math.random() < .5 ? 'A' : 'B';
      return [road(2, first), road(4, second), fault(5, van), road(8, first, false), fault(10, van, false)];
    }
    return [];
  }

  function roadName(id) { return sim.state.roads.find((road) => road.id === id)?.name ?? id; }

  function incidentText(incident) {
    if (incident.type === 'road') return `${roadName(incident.id)}${incident.active ? '封闭' : '恢复通行'}`;
    return `${incident.id} 车${incident.active ? '故障' : '修复'}`;
  }

  function applyIncident(incident) {
    const state = sim.state;
    const replans = state.replans;
    if (incident.type === 'road') {
      if (state.closedRoads.includes(incident.id) === incident.active) return false;
      const moving = state.vans.filter((van) => van.status === 'moving');
      sim.toggleRoad(incident.id);
      if (incident.active && state.replans > replans) narrate('autoDetour', true);
      else if (state.mode === 'manual' && moving.some((van) => van.status === 'stopped')) narrate('manualBlocked', true);
    } else {
      if (!sim.setVanFailure(incident.id, incident.active)) return false;
      if (state.delegated && incident.active) narrate('autoFault', true);
    }
    return true;
  }

  function recordIncident(type, id, active) {
    if (finished()) return;
    const incident = { at: sim.state.elapsed, type, id, active };
    if (applyIncident(incident)) customIncidents.push(incident);
    renderUi();
    remember();
  }

  function advanceSimulation(minutes) {
    const end = Math.min(sim.state.deadline, sim.state.elapsed + minutes);
    while (!finished() && incidentCursor < scheduledIncidents.length && scheduledIncidents[incidentCursor].at <= end + 1e-8) {
      const incident = scheduledIncidents[incidentCursor++];
      sim.tick(Math.max(0, incident.at - sim.state.elapsed));
      if (!finished()) applyIncident(incident);
    }
    if (!finished()) sim.tick(Math.max(0, end - sim.state.elapsed));
  }

  function runSummary() {
    const state = sim.state;
    const sites = Object.values(state.sites);
    return {
      mode: state.mode, elapsed: state.elapsed, restored: sites.filter((site) => site.powered).length,
      onTime: sites.filter((site) => site.powered && site.at <= site.due + 1e-6).length,
      manual: state.manualDispatches, auto: state.aiDispatches, replans: state.replans,
    };
  }

  function formatResult(summary) {
    const mode = summary.mode === 'auto' ? 'AI 协同' : '逐步调度';
    return `${mode} · ${timeText(summary.elapsed)} · 复电 ${summary.restored}/3 · 按时 ${summary.onTime}/3 · 人工派车 ${summary.manual} 次 · AI 派车 ${summary.auto} 次 · 自动改道 ${summary.replans} 次`;
  }

  function remember() {
    userInteracted = true;
    const { mode, closedRoads, elapsed, sites } = sim.state;
    window.openai?.setWidgetState?.({
      modelContent: { mode, scenario, closedRoads, elapsedMinutes: Math.round(elapsed * 10) / 10, powered: Object.keys(sites).filter((id) => sites[id].powered) },
      privateContent: { mode },
    })?.catch(() => {});
  }

  function colors() {
    const host = getComputedStyle(root);
    const swatch = document.createElement('span');
    swatch.hidden = true;
    root.append(swatch);
    const names = {
      background: '--background', foreground: '--foreground', muted: '--muted', blue: '--blue',
      orange: '--orange', green: '--green', red: '--red', purple: '--purple',
    };
    const palette = {};
    for (const [key, token] of Object.entries(names)) {
      const value = host.getPropertyValue(token).trim();
      swatch.style.color = value ? `var(${token})` : 'currentColor';
      const computed = getComputedStyle(swatch).color;
      if (value && typeof THREE !== 'undefined') {
        const context = document.createElement('canvas').getContext('2d');
        context.fillStyle = computed;
        const normalized = context.fillStyle;
        if (normalized.startsWith('#') || normalized.startsWith('rgb')) palette[key] = normalized;
        else {
          context.fillRect(0, 0, 1, 1);
          const [r, g, b] = context.getImageData(0, 0, 1, 1).data;
          palette[key] = `rgb(${r}, ${g}, ${b})`;
        }
      }
    }
    swatch.remove();
    return palette;
  }

  function timeText(minutes) {
    const seconds = Math.floor(Math.max(0, minutes) * 60 + .0001);
    return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  }

  function setText(node, text) {
    if (node.textContent !== text) node.textContent = text;
  }

  function setPressed(button, pressed) {
    const value = String(pressed);
    if (button.getAttribute('aria-pressed') !== value) button.setAttribute('aria-pressed', value);
  }

  function deadlineReached() { return sim.state.elapsed >= (sim.state.deadline ?? 20) - 1e-6; }
  function completed() { return Object.values(sim.state.sites).every((site) => site.powered); }
  function finished() { return deadlineReached() || completed(); }

  function stopNarration() {
    playbackVersion += 1;
    activeCue = null;
    pendingCue = null;
    voice.pause();
  }

  function narrate(cue, interrupt = false) {
    if (!narrationEnabled || !narration[cue]) return;
    if (activeCue && !interrupt) {
      if (activeCue !== cue) pendingCue = cue;
      return;
    }
    stopNarration();
    const version = playbackVersion;
    const line = narration[cue];
    const caption = get('caption');
    activeCue = cue;
    caption.dataset.cue = cue;
    setText(caption, line.text);
    setText(get('voice-status'), 'MiniMax 正在讲解');
    voice.src = `data:audio/ogg;base64,${line.audio}`;
    voice.play().catch(() => {
      if (version !== playbackVersion) return;
      activeCue = null;
      setText(get('voice-status'), 'MiniMax 讲解字幕 · 可点重听');
    });
  }

  function outcomeCue() {
    if (completed()) return sim.state.mode === 'auto' ? 'autoDone' : 'manualDone';
    return 'deadline';
  }

  function currentCue() {
    const state = sim.state;
    if (finished()) return outcomeCue();
    if (state.mode === 'auto') {
      if (!state.delegated) return 'autoIntro';
      return state.closedRoads.length && state.replans ? 'autoDetour' : 'delegated';
    }
    return state.vans.some((van) => van.status === 'stopped') ? 'manualBlocked' : 'manualIntro';
  }

  function pick(kind, id) {
    if (kind === 'site') {
      selectedSite = id;
      selection = { kind, id };
    } else if (kind === 'van') {
      selectedVan = id;
      selection = { kind, id };
    } else if (kind === 'road') {
      selectedRoad = id;
      selection = { kind, id };
    }
    renderUi();
    remember();
  }

  function start() {
    if (!started && !finished()) {
      started = true;
      running = true;
    }
  }

  function restart(mode, incidents = preset, comparison = null) {
    sim = createBlackoutSim(mode);
    selectedSite = 'clinic';
    selectedVan = 'A';
    selectedRoad = 'CE';
    selection = { kind: 'site', id: selectedSite };
    scheduledIncidents = incidents;
    customIncidents = [];
    incidentCursor = 0;
    baseline = comparison;
    started = false;
    running = false;
    outcomeRecorded = false;
    restoredNarrated = false;
    eventSignature = '';
    advanceSimulation(0);
    renderUi();
    narrate(mode === 'auto' ? 'autoIntro' : 'manualIntro', true);
  }

  function renderPins() {
    const { sites, vans, elapsed } = sim.state;
    for (const pin of pins) {
      if (pin.dataset.site) {
        const id = pin.dataset.site;
        const site = sites[id];
        pin.dataset.powered = String(site.powered);
        setPressed(pin, selectedSite === id);
        const status = site.powered ? (site.at <= site.due + 1e-6 ? '按时' : '迟到') : elapsed > site.due ? '超时' : `${site.due} 分`;
        setText(pin.querySelector('[data-pin-name]'), `${siteNames[id]} · ${status}`);
        pin.setAttribute('aria-label', `${siteNames[id]}，${site.powered ? '已供电' : '停电'}，${status}`);
      } else if (pin.dataset.van) {
        const id = pin.dataset.van;
        const van = vans.find((item) => item.id === id);
        pin.dataset.failed = String(van.failed);
        setPressed(pin, selectedVan === id);
        pin.setAttribute('aria-label', `${id} 车，${van.failed ? '故障停驶' : statuses[van.status] ?? van.status}`);
      }
    }
  }

  function renderEvents() {
    const events = sim.state.events.slice(0, 6);
    const signature = JSON.stringify(events);
    if (signature === eventSignature) return;
    eventSignature = signature;
    const rows = events.map(({ at, text }) => {
      const row = document.createElement('li');
      const time = document.createElement('span');
      const message = document.createElement('span');
      time.className = 'text-small text-muted tabular-nums';
      time.textContent = timeText(at);
      message.textContent = text;
      row.append(time, message);
      return row;
    });
    get('events').replaceChildren(...rows);
  }

  function renderUi() {
    const state = sim.state;
    const isAuto = state.mode === 'auto';
    const site = state.sites[selectedSite];
    const van = state.vans.find((item) => item.id === selectedVan);
    const siteName = siteNames[selectedSite];
    const result = finished();
    const summary = runSummary();
    const restored = summary.restored;
    setText(get('clock'), `${timeText(state.elapsed)} / ${timeText(state.deadline ?? 20)}`);
    setText(get('restored'), `${restored} / 3`);
    setText(get('on-time'), `${summary.onTime} / 3`);
    for (const button of modeButtons) setPressed(button, button.dataset.mode === state.mode);
    get('manual').hidden = isAuto;
    get('auto').hidden = !isAuto;
    get('pause').disabled = result;
    setText(get('pause'), !started ? '开始计时' : !running && !result ? '继续' : '暂停');
    get('shuffle').hidden = scenario !== 'random';
    get('compare').disabled = !started && !customIncidents.length;
    const nextIncident = scheduledIncidents[incidentCursor];
    const remainingIncidents = scheduledIncidents.length - incidentCursor;
    setText(get('scenario-summary'), nextIncident
      ? `下个事件 ${timeText(nextIncident.at)} ${incidentText(nextIncident)} · 还剩 ${remainingIncidents} 个`
      : scheduledIncidents.length ? '预设事故已执行' : '点击道路或车辆，随时设置事故');
    const roadSelect = get('road-select');
    for (const option of roadSelect.options) {
      setText(option, `${roadName(option.value)}${state.closedRoads.includes(option.value) ? ' · 已封' : ''}`);
    }
    roadSelect.value = selectedRoad;
    const roadClosed = state.closedRoads.includes(selectedRoad);
    const roadButton = get('road');
    setText(roadButton, roadClosed ? `恢复${roadName(selectedRoad)}` : `封闭${roadName(selectedRoad)}`);
    setPressed(roadButton, roadClosed);
    roadButton.disabled = result;
    const failureButton = get('failure');
    setText(failureButton, van.failed ? `修复 ${selectedVan} 车` : `模拟 ${selectedVan} 车故障`);
    setPressed(failureButton, van.failed);
    failureButton.disabled = result;
    const eta = isAuto || site.powered ? null : sim.estimate(selectedVan, selectedSite);
    const dispatch = get('dispatch');
    setText(dispatch, `${selectedVan} 车${van.status === 'stopped' ? '重新派车' : '出发'} → ${siteName}`);
    dispatch.disabled = result || site.powered || eta === null || !van.carrying || van.failed || van.status === 'returning' || (van.status === 'moving' && van.target === selectedSite);
    const delegate = get('delegate');
    setText(delegate, result ? '调度结束' : state.delegated ? 'AI 正在调度' : '委托 AI 恢复供电');
    delegate.disabled = result || state.delegated;
    const priority = get('priority');
    setText(priority, `${state.priority === selectedSite ? '当前优先' : '优先'}${siteName}`);
    priority.disabled = result || site.powered || state.priority === selectedSite;
    get('permission').checked = state.permission;
    get('permission').disabled = result;

    let detail;
    const restoredDetail = site.powered
      ? `${siteName}${site.at <= site.due + 1e-6 ? '按时' : '超时'}复电 · ${site.by} 车送达 · ${site.source === 'AI' ? 'AI' : '你'}调度 · ${timeText(site.at)}${site.reason ? ` · ${site.reason}` : ''}`
      : '';
    if (completed()) detail = `三处已复电 · ${summary.onTime} 处按时 · 用时 ${timeText(state.elapsed)} · ${restoredDetail}`;
    else if (deadlineReached()) detail = `20 分钟已到 · ${restored} 处已复电 · ${summary.onTime} 处按时`;
    else if (site.powered) detail = restoredDetail;
    else if (isAuto) {
      detail = state.delegated
        ? `优先${siteNames[state.priority]} · AI 派车 ${summary.auto} 次 · 自动改道 ${summary.replans} 次`
        : `优先${siteNames[state.priority]} · 授权 B 车后可以并行送电`;
    } else if (van.failed) detail = `${selectedVan} 车故障停驶 · 可修复或改派另一辆车`;
    else if (van.status === 'stopped') detail = `${selectedVan} 车等待指令 · ${eta === null ? '当前无可用路线' : '点击重新派车，按新路线出发'}`;
    else if (van.status === 'moving') detail = `${selectedVan} 车正前往${siteNames[van.target]} · 已封 ${state.closedRoads.length} 段道路 · 人工派车 ${summary.manual} 次`;
    else detail = `${selectedVan} 车${statuses[van.status] ?? '待命'} · ${siteName}限时 ${site.due} 分钟${eta === null ? ' · 暂无可用路线' : ` · 预计 ${eta.toFixed(1)} 分钟到达`}`;
    setText(get('detail'), detail);
    get('plan').hidden = !isAuto || !state.delegated || result || !state.planNote;
    setText(get('plan'), state.planNote ? `AI 判断 · ${state.planNote}` : '');
    get('comparison').hidden = !baseline;
    if (baseline) {
      setText(get('baseline'), `上轮 ${formatResult(baseline)}`);
      setText(get('current-result'), `本轮 ${formatResult(summary)}`);
      setText(get('comparison-note'), customIncidents.length
        ? '本轮另加了事故。重跑可回到原事故时间表。'
        : '两轮沿用同一事故时间表。车辆授权和派车由本轮操作者决定。');
    }
    renderPins();
    renderEvents();
  }

  function placePins() {
    const { clientWidth: width, clientHeight: height } = world;
    const placed = [];
    for (const pin of pins) {
      const kind = pin.dataset.site ? 'site' : 'van';
      const id = pin.dataset.site || pin.dataset.van;
      const point = scene.project(kind, id);
      const inside = point && point.visible && point.x > -10 && point.y > -10 && point.x < width + 10 && point.y < height + 10;
      pin.hidden = !inside;
      if (!inside) continue;
      const halfWidth = pin.offsetWidth / 2;
      const halfHeight = pin.offsetHeight / 2;
      const x = Math.max(halfWidth + 3, Math.min(width - halfWidth - 3, point.x));
      const lift = kind === 'van' ? 22 : 10;
      const baseY = Math.max(halfHeight + 3, Math.min(height - halfHeight - 3, point.y - lift));
      const offsets = [0, -1, 1, -2, 2, -3, 3];
      const y = offsets.map((step) => baseY + step * (pin.offsetHeight + 3)).find((candidate) =>
        candidate > halfHeight && candidate < height - halfHeight && placed.every((other) =>
          Math.abs(x - other.x) > halfWidth + other.halfWidth + 4 || Math.abs(candidate - other.y) > halfHeight + other.halfHeight + 2,
        ),
      ) ?? baseY;
      pin.style.left = `${x.toFixed(1)}px`;
      pin.style.top = `${y.toFixed(1)}px`;
      placed.push({ x, y, halfWidth, halfHeight });
    }
  }

  function frame(now) {
    const delta = Math.min(.15, (now - (previousFrame || now)) / 1000);
    previousFrame = now;
    if (running && !finished()) {
      advanceSimulation(delta * minutePerSecond);
    }
    if (finished() && !outcomeRecorded) {
      running = false;
      outcomeRecorded = true;
      renderUi();
      narrate(outcomeCue());
    } else if (!restoredNarrated && Object.values(sim.state.sites).some((site) => site.powered)) {
      restoredNarrated = true;
      narrate('firstPower');
    }
    if (now - previousReadout > 230) {
      renderUi();
      previousReadout = now;
    }
    const paintInterval = reducedMotion.matches ? 60 : 28;
    if (now - previousPaint >= paintInterval) {
      if (scene.draw({ ...sim.state, selection })) placePins();
      previousPaint = now;
    }
    requestAnimationFrame(frame);
  }

  function mount() {
    try {
      scene = createBlackoutScene(canvas, pick, colors());
    } catch (error) {
      get('error').hidden = false;
      setText(get('error'), '当前预览无法启动 WebGL 3D。');
      for (const button of root.querySelectorAll('button, input')) button.disabled = true;
      console.error(error);
      return;
    }
    for (const button of modeButtons) button.addEventListener('click', () => {
      if (sim.state.mode !== button.dataset.mode) {
        restart(button.dataset.mode);
        remember();
      }
    });
    for (const pin of all('site')) pin.addEventListener('click', () => pick('site', pin.dataset.site));
    for (const pin of all('van')) pin.addEventListener('click', () => pick('van', pin.dataset.van));
    for (const road of sim.state.roads) {
      const option = document.createElement('option');
      option.value = road.id;
      option.textContent = road.name;
      get('road-select').append(option);
    }
    get('road-select').addEventListener('change', (event) => pick('road', event.target.value));
    get('road').addEventListener('click', () => {
      selection = { kind: 'road', id: selectedRoad };
      recordIncident('road', selectedRoad, !sim.state.closedRoads.includes(selectedRoad));
    });
    get('failure').addEventListener('click', () => {
      const van = sim.state.vans.find((item) => item.id === selectedVan);
      selection = { kind: 'van', id: selectedVan };
      recordIncident('van', selectedVan, !van.failed);
    });
    get('scenario').addEventListener('change', (event) => {
      scenario = event.target.value;
      preset = scenarioPlan(scenario);
      restart(sim.state.mode);
      remember();
    });
    get('shuffle').addEventListener('click', () => {
      preset = scenarioPlan(scenario);
      restart(sim.state.mode);
      remember();
    });
    get('compare').addEventListener('click', () => {
      const timeline = [...scheduledIncidents, ...customIncidents].sort((a, b) => a.at - b.at);
      restart(sim.state.mode === 'manual' ? 'auto' : 'manual', timeline, runSummary());
      remember();
    });
    for (const button of all('camera')) button.addEventListener('click', () => cameraActions[button.dataset.camera]());
    get('dispatch').addEventListener('click', () => {
      if (sim.dispatch(selectedVan, selectedSite)) start();
      renderUi();
      remember();
    });
    get('delegate').addEventListener('click', () => {
      if (sim.delegate()) narrate('delegated', true);
      start();
      renderUi();
      remember();
    });
    get('priority').addEventListener('click', () => { sim.setPriority(selectedSite); renderUi(); remember(); });
    get('permission').addEventListener('change', (event) => {
      const allowed = event.target.checked;
      if (sim.setPermission(allowed)) narrate(allowed ? 'granted' : 'revoked', !allowed);
      renderUi();
      remember();
    });
    get('restart').addEventListener('click', () => { restart(sim.state.mode, scheduledIncidents, baseline); remember(); });
    get('pause').addEventListener('click', () => {
      if (started) running = !running;
      else start();
      renderUi();
    });
    get('voice').addEventListener('click', () => {
      narrationEnabled = !narrationEnabled;
      get('voice').setAttribute('aria-expanded', String(narrationEnabled));
      setText(get('voice'), narrationEnabled ? '关闭讲解' : '听讲解');
      get('narration').hidden = !narrationEnabled;
      if (narrationEnabled) narrate(currentCue(), true);
      else stopNarration();
    });
    get('replay').addEventListener('click', () => narrate(get('caption').dataset.cue ?? currentCue(), true));
    voice.addEventListener('ended', () => {
      activeCue = null;
      if (pendingCue) narrate(pendingCue);
      else setText(get('voice-status'), 'MiniMax 讲解字幕');
    });
    window.addEventListener('openai:set_globals', (event) => {
      const snapshot = event.detail?.globals?.widgetState;
      if (!userInteracted && snapshot?.privateContent?.mode) restart(savedMode(snapshot));
    });
    renderUi();
    requestAnimationFrame(frame);
  }

  mount();
})();
</script>
