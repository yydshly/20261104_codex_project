<main id="city-system-2031" lang="zh-CN" aria-labelledby="cs-title">
  <header class="cs-header">
    <h1 id="cs-title"><span aria-hidden="true"></span>2031 <small>／ 城市运行实验</small></h1>
    <div class="cs-header-actions">
      <span class="cs-simulation">情景推演</span>
      <button class="cs-voice-entry" type="button" data-voice aria-pressed="false" aria-controls="cs-voice-notes">听讲解</button>
      <button class="cs-value-entry" type="button" data-value-open aria-controls="cs-value" aria-expanded="false">看 AI 的价值</button>
    </div>
  </header>

  <div class="cs-toolbar">
    <div class="cs-control">
      <span class="cs-control-label">同一场热浪</span>
      <div class="cs-toggle" role="group" aria-label="配电机制">
        <button type="button" data-mode="isolated" aria-pressed="false">按比例限电</button>
        <button type="button" data-mode="coordinated" aria-pressed="true">AI 联合调度</button>
      </div>
    </div>
    <div class="cs-control" data-policy-control>
      <span class="cs-control-label">你定优先级</span>
      <div class="cs-toggle" role="group" aria-label="调度优先级">
        <button type="button" data-policy="care" aria-pressed="true">民生优先</button>
        <button type="button" data-policy="industry" aria-pressed="false">生产优先</button>
      </div>
    </div>
  </div>

  <section class="cs-stage" aria-labelledby="cs-stage-title">
    <canvas data-canvas role="img" aria-label="互动 3D 城市，显示供电线路、储能站和避暑接驳"></canvas>
    <div class="cs-shade" aria-hidden="true"></div>
    <div class="cs-pins">
      <button class="cs-pin" type="button" data-pin="city" aria-pressed="false"><span>供水站</span><b></b></button>
      <button class="cs-pin" type="button" data-pin="clinic" aria-pressed="false"><span>医院</span><b></b></button>
      <button class="cs-pin" type="button" data-pin="home" aria-pressed="false"><span>社区</span><b></b></button>
      <button class="cs-pin" type="button" data-pin="logistics" aria-pressed="false"><span>避暑接驳</span><b></b></button>
      <button class="cs-pin" type="button" data-pin="work" aria-pressed="false"><span>工厂</span><b></b></button>
    </div>
    <div class="cs-hud" data-hud>
      <div class="cs-kicker"><span aria-hidden="true"></span><time data-hour>13:00</time><span data-scene-tag>热浪将至</span></div>
      <h2 id="cs-stage-title" data-scene-title>全城缺电，先保谁？</h2>
      <div class="cs-grid-readout" aria-label="电网和储能供电">
        <div><span>可用供电</span> <strong data-supply></strong> <span data-demand></span></div>
        <div class="cs-meter" aria-hidden="true"><i data-meter-grid></i><i data-meter-battery></i></div>
        <div class="cs-grid-key"><span>电网</span><span>储能</span><span data-storage></span></div>
      </div>
      <button class="cs-start" type="button" data-start><span aria-hidden="true">▶︎</span> 一键推演</button>
    </div>
    <div class="cs-map-tools">
      <button type="button" data-reset>全景</button>
    </div>
    <p class="cs-fallback" data-fallback hidden>当前浏览器无法渲染 3D。时间轴和调度对照仍可操作。</p>
    <div class="cs-stage-bottom">
      <div class="cs-facts" aria-label="当前关键服务" data-facts hidden>
        <span data-water></span>
        <span data-buses></span>
        <span data-industry></span>
      </div>
      <span class="cs-map-hint">拖动旋转 · 滚轮缩放</span>
    </div>
  </section>

  <div class="cs-transport" aria-label="推演时间轴">
    <button class="cs-play" type="button" data-play aria-label="播放推演">▶︎</button>
    <ol class="cs-timeline" data-timeline></ol>
  </div>
  <div class="cs-action" data-action-row>
    <strong data-action-label>当前动作</strong>
    <p data-action aria-live="polite"></p>
  </div>

  <section id="cs-value" class="cs-value" data-value-panel hidden aria-label="AI 的价值对照">
    <header class="cs-value-controls">
      <div class="cs-toggle" role="group" aria-label="AI 价值拆解">
        <button type="button" data-value-topic="forecast" aria-pressed="false">提前留电</button>
        <button type="button" data-value-topic="coordination" aria-pressed="true">阻断连锁</button>
        <button type="button" data-value-topic="tradeoff" aria-pressed="false">人定取舍</button>
      </div>
      <button class="cs-value-compare" type="button" data-value-compare></button>
    </header>
    <div class="cs-value-key"><strong data-value-current></strong><span data-value-other></span></div>
    <ol class="cs-evidence" aria-label="三个观测点">
      <li data-value-tile><span></span><strong></strong><small></small><div class="cs-value-bars" aria-hidden="true"><i></i><i></i></div></li>
      <li data-value-tile><span></span><strong></strong><small></small><div class="cs-value-bars" aria-hidden="true"><i></i><i></i></div></li>
      <li data-value-tile><span></span><strong></strong><small></small><div class="cs-value-bars" aria-hidden="true"><i></i><i></i></div></li>
    </ol>
    <p class="cs-value-note" data-value-note></p>
  </section>

  <section class="cs-receipt" aria-labelledby="cs-receipt-title">
    <header>
      <h2 id="cs-receipt-title">累计至 <time data-metrics-hour>13:00</time> 时段末</h2>
      <span data-comparison></span>
    </header>
    <dl>
      <div><dt>累计降温服务</dt><dd><strong data-cooling></strong> 人次</dd><span data-cooling-compare></span></div>
      <div><dt>门诊供电不足</dt><dd><strong data-clinic></strong> 小时</dd><span data-clinic-compare></span></div>
      <div><dt>生产用电移峰</dt><dd><strong data-work></strong> MWh</dd><span data-work-unserved></span></div>
    </dl>
  </section>
  <div id="cs-voice-notes" class="cs-voice-notes" data-voice-notes hidden>
    <div>
      <button type="button" data-voice-replay>重听本段</button>
      <span data-voice-status role="status"></span>
    </div>
    <details>
      <summary>讲解文字</summary>
      <p data-voice-transcript></p>
    </details>
  </div>
  <p class="cs-note">各方案经历同一场热浪，用电需求和初始储能一致。切换对照会从起点重算，时间停在当前时刻。</p>
  <audio data-voice-audio preload="none" hidden></audio>
</main>

<script>
function simulateCitySystem({ mode = 'coordinated', policy = 'care', forecastEnabled = true } = {}) {
  if (!['isolated', 'coordinated'].includes(mode) || !['care', 'industry'].includes(policy)) {
    throw new RangeError('Unknown city simulation mode or priority.');
  }

  // Each forecast row covers one hour. Power is in MW and storage is in MWh.
  const districts = ['city', 'clinic', 'home', 'logistics', 'work'];
  const forecast = [
    [13, '热浪前', 94, 12, 14, 22, 10, 26],
    [14, '供电降容', 78, 16, 16, 28, 12, 28],
    [15, '降温负荷上涨', 66, 18, 18, 32, 12, 28],
    [16, '热浪峰值', 60, 18, 18, 34, 12, 26],
    [17, '高温持续', 66, 16, 16, 30, 10, 24],
    [18, '气温回落', 78, 14, 14, 24, 8, 22],
  ].map(([hour, title, grid, ...load]) => ({
    hour, title, grid,
    demand: Object.fromEntries(districts.map((district, i) => [district, load[i]])),
    totalDemand: load.reduce((sum, demand) => sum + demand, 0),
  }));
  const coordinated = mode === 'coordinated';
  const plansAhead = coordinated && forecastEnabled;
  const priority = policy === 'care'
    ? ['clinic', 'logistics', 'home', 'city', 'work']
    : ['work', 'city', 'clinic', 'logistics', 'home'];
  const initialBattery = 24;
  const dischargeLimit = 10;
  const availableDischarge = (battery, demand, grid) =>
    Math.min(dischargeLimit, battery, Math.max(0, demand - grid));
  const waterMinimum = (demand) => Math.ceil(demand.city * .82);

  function allocate(demand, totalDemand, available) {
    if (available >= totalDemand) return { ...demand };
    if (!coordinated) {
      const shares = districts.map((district) => [district, demand[district] * available / totalDemand]);
      const assigned = Object.fromEntries(shares.map(([district, share]) => [district, Math.floor(share)]));
      const remainder = available - Object.values(assigned).reduce((sum, power) => sum + power, 0);
      shares.sort(([, a], [, b]) => (b % 1) - (a % 1));
      for (const [district] of shares.slice(0, remainder)) assigned[district] += 1;
      return assigned;
    }

    const floors = {
      city: waterMinimum(demand), clinic: 12, home: 12, logistics: 6, work: 6,
    };
    const assigned = {};
    let remaining = available;
    for (const district of districts) {
      assigned[district] = Math.min(remaining, floors[district], demand[district]);
      remaining -= assigned[district];
    }
    for (const district of priority) {
      const increase = Math.min(remaining, demand[district] - assigned[district]);
      assigned[district] += increase;
      remaining -= increase;
    }
    return assigned;
  }

  function effects(demand, allocated, derating) {
    const waterReady = allocated.city >= waterMinimum(demand);
    const shuttles = waterReady && allocated.logistics >= 7
      ? Math.min((allocated.logistics - 6) * 4, (allocated.city - 10) * 5)
      : 0;
    const coolingTrips = shuttles * 35;
    return {
      waterReady,
      shuttles,
      coolingTrips,
      coolingPeople: allocated.home * 45 + coolingTrips,
      // Underpowered water pumps reduce grid cooling capacity in the following hour.
      nextDerating: waterReady ? Math.max(0, derating - 8) : Math.min(22, derating + 11),
    };
  }

  const plans = new Map();
  function reserve(index, batteryRemaining, derating) {
    if (index === forecast.length) return { release: 0, score: 0 };
    const key = `${index}:${batteryRemaining}:${derating}`;
    if (plans.has(key)) return plans.get(key);
    const { demand, totalDemand, grid } = forecast[index];
    const gridSupply = grid - derating;
    const limit = availableDischarge(batteryRemaining, totalDemand, gridSupply);
    let best = { release: 0, score: -Infinity };
    for (let release = 0; release <= limit; release += 1) {
      const allocation = allocate(demand, totalDemand, gridSupply + release);
      const result = effects(demand, allocation, derating);
      // Preserve the grid and critical services, then apply the human-set priority.
      const score = policy === 'care'
        ? allocation.clinic * 10 + result.coolingPeople / 12 + allocation.work
        : allocation.clinic * 4 + result.coolingPeople / 60 + allocation.work * 8;
      const next = reserve(index + 1, batteryRemaining - release, result.nextDerating);
      if (score + next.score > best.score) best = { release, score: score + next.score };
    }
    plans.set(key, best);
    return best;
  }

  let batteryRemaining = initialBattery;
  let derating = 0;
  let coolingPeople = 0;
  let clinicHoursAtRisk = 0;
  let workDeferred = 0;
  let workUnserved = 0;
  return forecast.map(({ hour, title, grid: forecastGrid, demand, totalDemand }, index) => {
    const grid = forecastGrid - derating;
    const batteryBefore = batteryRemaining;
    const dischargeIfImmediate = availableDischarge(batteryBefore, totalDemand, grid);
    const battery = plansAhead ? reserve(index, batteryBefore, derating).release : dischargeIfImmediate;
    batteryRemaining -= battery;
    const total = grid + battery;
    const allocated = allocate(demand, totalDemand, total);
    const result = effects(demand, allocated, derating);
    const workShortfall = demand.work - allocated.work;
    const shiftedWork = coordinated ? Math.min(18, workShortfall) : 0;
    const gap = Math.max(0, totalDemand - total);
    coolingPeople += result.coolingPeople;
    clinicHoursAtRisk += Number(allocated.clinic < demand.clinic);
    workDeferred += shiftedWork;
    workUnserved += workShortfall - shiftedWork;

    const districtStates = Object.fromEntries(districts.map((district) => {
      const level = allocated[district] / demand[district];
      const critical = district === 'city' ? !result.waterReady : level < .55;
      return [district, {
        demand: demand[district],
        allocated: allocated[district],
        level,
        status: critical ? 'critical' : level < 1 ? 'limited' : 'normal',
      }];
    }));
    const flows = districts.filter((district) => district !== 'city' && allocated[district] > 0).map((district) => ({
      from: 'city', to: district, amount: allocated[district], kind: 'energy',
      intensity: districtStates[district].level,
    }));
    if (result.coolingTrips) flows.push({
      from: 'logistics', to: 'home', amount: result.coolingTrips, kind: 'people',
      intensity: Math.min(1, result.coolingTrips / 840),
    });

    let action = '电网余量覆盖各区用电，储能待命。';
    if (gap && !coordinated) {
      action = result.waterReady
        ? '各区按比例限电，储能直接补充当前缺口。'
        : '供水泵低于最低功率，避暑接驳停运，电网冷却持续受限。';
    } else if (gap) {
      const storage = battery ? `储能补充 ${battery} MW`
        : batteryRemaining ? '储能留待后续时段' : '储能已用尽';
      action = `保障水泵供电，${shiftedWork ? `工厂移峰 ${shiftedWork} MW` : '维持当班生产'}，${storage}。`;
    }
    const snapshot = {
      index, hour, title, action, mode, policy, flows, forecastEnabled: plansAhead,
      supply: {
        grid, battery, total, demand: totalDemand, gap, derating,
        batteryBefore, dischargeIfImmediate, batteryHeld: dischargeIfImmediate - battery,
        batteryRemaining, batteryCapacity: initialBattery,
      },
      districts: districtStates,
      metrics: { coolingPeople, clinicHoursAtRisk, workDeferred, workUnserved, batteryRemaining },
      shiftedWork,
      waterReady: result.waterReady,
      waterMinimum: waterMinimum(demand),
      coolingTrips: result.coolingTrips,
      shuttles: result.shuttles,
    };
    derating = result.nextDerating;
    return snapshot;
  });
}

function createWorldScene(canvas, onPick) {
  const T = window.THREE;
  if (!T) throw new Error('Three.js runtime is unavailable.');
  const renderer = new T.WebGLRenderer({canvas, alpha: true, antialias: true, powerPreference: 'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
  renderer.setClearColor(0x071925, 0);
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.03;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;

  const scene = new T.Scene();
  scene.fog = new T.Fog(0x1c2b40, 105, 325);
  const camera = new T.PerspectiveCamera(38, 1, .2, 420);
  const focusPoint = new T.Vector3();
  const defaultFocus = new T.Vector3(0, 3.2, -2);
  focusPoint.copy(defaultFocus);
  const destination = defaultFocus.clone();
  const pointer = new T.Vector2();
  const raycaster = new T.Raycaster();
  const projectPoint = new T.Vector3();
  const selectionRoots = [];

    box(city.root,materials.light,6.85+.99*n,1.22,-21.30,.34,.25,.04,false);
  }
  for (const [x,z] of [[-8,-24.5], [8.1,-24.1]]) {
    pipe(city.root,materials.light,[x,.23,z],[x,7.1,z],.16);
    const wheel = new T.Group();
    wheel.position.set(x,7,z+.36);
    wheel.rotation.y = .3;
    city.root.add(wheel);
    const blades = new T.Group();
    wheel.add(blades);
    mesh(blades,sphere,materials.steel,0,0,0,.22,.22,.22,false);
    for (let n=0;n<3;n++) {
      const arm=new T.Group();
      arm.rotation.z=n*Math.PI*2/3;
      blades.add(arm);
      box(arm,materials.light,0,1.02,0,.19,1.97,.08,false).rotation.z=.12;
    }
    turbines.push(blades);
  }

  for (const data of Object.values(districts)) {
    const windows = new T.InstancedMesh(cube, data.window, data.windows.length);
    data.windows.forEach(([x,y,z,w,h,d], index) => {
      helper.position.set(x,y,z);
      helper.scale.set(w,h,d);
      helper.updateMatrix();
      windows.setMatrixAt(index,helper.matrix);
    });
    data.root.add(windows);
    data.windows = windows;
  }

  function instanceStaticMeshes(parent) {
    const batches = new Map();
    for (const item of parent.children) {
      if (!item.isMesh || item.isInstancedMesh || !item.material.isMeshStandardMaterial) continue;
      const key = `${item.geometry.uuid}|${item.material.uuid}|${item.castShadow}|${item.receiveShadow}`;
      if (!batches.has(key)) batches.set(key, []);
      batches.get(key).push(item);
    }
    for (const batch of batches.values()) {
      if (batch.length < 3) continue;
      const [first] = batch;
      const instances = new T.InstancedMesh(first.geometry, first.material, batch.length);
      instances.castShadow = first.castShadow;
      instances.receiveShadow = first.receiveShadow;
      batch.forEach((item, index) => {
        item.updateMatrix();
        instances.setMatrixAt(index, item.matrix);
        parent.remove(item);
      });
      instances.computeBoundingSphere();
      parent.add(instances);
    }
  }

  instanceStaticMeshes(scene);
  instanceStaticMeshes(neighborhood);
  for (const data of Object.values(districts)) instanceStaticMeshes(data.root);

  const powerColor = new T.Color(0x81ffd0);
  const constrainedColor = new T.Color(0xffa560);
  const coolColor = 0x70deff;
  const lightWindow = new T.Color(0xffd4a0);
  const darkWindow = new T.Color(0x243746);
  const tintedWindow = new T.Color();
  const stateColor = new T.Color();
  const lineColor = new T.Color();
  const unit = (value, fallback = 0) => Number.isFinite(value) ? T.MathUtils.clamp(value, 0, 1) : fallback;
  const signal = (color, opacity = 1) => new T.MeshBasicMaterial({
    color, transparent:true, opacity, depthWrite:false, toneMapped:false,
  });

  function route(points) {
    const path = new T.CurvePath();
    for (let index=1; index<points.length; index++) {
      path.add(new T.LineCurve3(new T.Vector3(...points[index-1]), new T.Vector3(...points[index])));
    }
    return path;
  }

  function rail(path, radius, surface, order) {
    const line = new T.Mesh(new T.TubeGeometry(path, 50, radius, 5, false), surface);
    line.renderOrder = order;
    scene.add(line);
    return line;
  }

  const feedLines = Object.fromEntries(Object.entries({
    work: [[1,.5,-4.45],[-23,.5,-4.45]],
    clinic: [[1,.5,-5.65],[24,.5,-5.65]],
    home: [[1,.5,-4.45],[-15.45,.5,-4.45],[-15.45,.5,10.06],[-27,.5,10.06]],
    logistics: [[1,.5,-5.65],[12.4,.5,-5.65],[12.4,.5,10.06],[26,.5,10.06]],
  }).map(([id, points]) => {
    const path = route(points);
    const surface = signal(powerColor,.7);
    const line = rail(path,.12,surface,12);
    const nodes = Array.from({length:3}, () => mesh(scene,sphere,surface,0,0,0,.38,.38,.38,false));
    for (const node of nodes) node.renderOrder=13;
    return [id, {path,line,surface,nodes}];
  }));

  const shuttlePath = route([[-27,.45,8.17],[28,.45,8.17],[28,.45,9.33],[-27,.45,9.33],[-27,.45,8.17]]);
  const shuttleRail = rail(shuttlePath,.18,signal(coolColor,.83),15);
  const shuttleBody = material(0x82dbea,{emissive:0x39a5b6,emissiveIntensity:.38,roughness:.44});
  const shuttleLights = signal(0xdafffb);
  const fleet = Array.from({length:6}, () => {
    const coach = new T.Group();
    box(coach,materials.dark,0,.31,0,2.52,.36,1.08,false);
    box(coach,shuttleBody,0,.66,0,2.52,.61,1.01,false);
    box(coach,materials.glass,-.08,.77,0,2.01,.31,1.03,false);
    box(coach,shuttleLights,1.27,.46,.31,.055,.15,.22,false);
    box(coach,shuttleLights,1.27,.46,-.31,.055,.15,.22,false);
    scene.add(coach);
    return coach;
  });

  const chargeCells = Array.from({length:6}, (_, index) => {
    const x = -2.75 + index*.84;
    box(city.root,materials.dark,x,.66,-9.83,.73,.9,1.55,false);
    return box(city.root,signal(powerColor),x,1.14,-9.83,.58,.09,1.31,false);
  });
  const batteryPath = route([[-2.75,1.2,-9.83],[1.4,1.2,-9.83],[1.4,.5,-5.6]]);
  const batteryLine = rail(batteryPath,.13,signal(0xc5abff,.91),14);
  const batteryPulse = mesh(scene,sphere,signal(0xe6d1ff),0,0,0,.41,.41,.41,false);

  const waterTank = new T.CylinderGeometry(1.24,1.24,2.8,24);
  for (const x of [7.7,10.6]) {
    mesh(city.root,waterTank,materials.steel,x,1.48,-14.8,1,1,1);
    const lid = mesh(city.root,cylinder,materials.glass,x,3,-14.8,1.26,.27,1.26,false);
    lid.material = material(0x2d839c,{emissive:0x196f9b,emissiveIntensity:.3});
    (city.waterLids ||= []).push(lid);
  }

  const shelterLights = [];
  for (let n=0;n<4;n++) {
    const x=19.5+3.3*n;
    const lamp=box(logistics.root,signal(coolColor),x,2.43,15.60,2.19,.32,.07,false);
    shelterLights.push(lamp);
    box(logistics.root,materials.dark,x,1.08,13.22,.15,1.74,.15,false);
    const canopy=box(logistics.root,shuttleBody,x,2,13.26,2.84,.13,2.28,false);
    canopy.rotation.z=.11;
  }
  const coolingWave = flat(scene,ring,signal(coolColor,.49),25,.372,17.9,12.7);
  coolingWave.renderOrder=10;
  const productionFans = Array.from({length:3}, (_, index) => {
    const rotor = new T.Group();
    rotor.position.set(-23.75+index*2.22,6.77,-20.5);
    box(rotor,materials.light,0,0,0,1.12,.09,.16,false);
    box(rotor,materials.light,0,0,0,.16,.09,1.12,false);
    work.root.add(rotor);
    return rotor;
  });

  for (const data of Object.values(districts)) {
    data.windows.material = new T.MeshBasicMaterial({color:0xffffff,toneMapped:false});
    data.windowLevel = -1;
    data.halo = flat(scene, disk, signal(constrainedColor,.16),data.x,.364,data.z,data.radius*.92);
    data.halo.renderOrder=4;
    const badge = new T.Group();
    badge.position.copy(data.anchor).add(new T.Vector3(5.5,.9,0));
    const outline = signal(0x211712,.94);
    const accent = signal(constrainedColor);
    const back = mesh(badge,disk,outline,0,0,0,1.26,1.26,1,false);
    const edge = mesh(badge,ring,accent,0,0,.024,1.27,1.27,1,false);
    const line = box(badge,accent,0,.22,.06,.22,.65,.07,false);
    const dot = box(badge,accent,0,-.39,.06,.22,.21,.07,false);
    for (const part of [back,edge,line,dot]) part.renderOrder=26;
    scene.add(badge);
    data.warning=badge;
  }

  const daylight = new T.Color(0xffe7bd);
  const hotSun = new T.Color(0xffbd85);
  const sky = new T.Color(0xc8def2);
  const coldFog = new T.Color(0x26384e);
  const hotFog = new T.Color(0x70565a);
  function updateCrisis(source, selected) {
    const power = source.power || {};
    const incident = Number(source.stage) > 0;
    const grid = unit(source.grid,1);
    const hot = incident ? .33 + (1-grid)*.45 : .05;
    const shuttleCount = Math.max(0,Math.min(fleet.length,Math.ceil(Number(source.shuttles) || 0)));
    sun.color.copy(daylight).lerp(hotSun,hot);
    sun.intensity=1.82;
    ambient.color.copy(sky);
    ambient.intensity=1.55;
    scene.fog.color.copy(coldFog).lerp(hotFog,hot*.75);

    for (const [id,data] of Object.entries(districts)) {
      const level=unit(power[id],1);
      const windowLevel=Math.round(level*16);
      if (data.windowLevel!==windowLevel) {
        data.windowLevel=windowLevel;
        for (let i=0; i<data.windows.count; i++) {
          const lit = (i*73+19)%127 < windowLevel/16*127;
          const mix = lit ? .57+(i%7)*.055 : .02;
          tintedWindow.copy(darkWindow).lerp(lightWindow,mix);
          data.windows.setColorAt(i,tintedWindow);
        }
        data.windows.instanceColor.needsUpdate=true;
      }
      const deficient = incident && level<.89;
      stateColor.copy(powerColor).lerp(constrainedColor, deficient ? 1 : 0);
      data.highlight.visible=incident || selected===id;
      data.highlight.material.color.copy(stateColor);
      data.highlight.material.opacity=selected===id ? .95 : deficient ? .82 : .57;
      data.halo.visible=deficient;
      data.halo.material.opacity=.1 + (1-level)*.15;
      data.warning.visible=incident && (level<.62 || id==='city' && source.outage);
      if (data.warning.visible) {
        data.warning.quaternion.copy(camera.quaternion);
        data.warning.scale.setScalar(.97 + Math.sin(flowTime*4)*.07);
      }
      const feed=feedLines[id];
      if (!feed) continue;
      feed.line.visible=incident;
      lineColor.copy(constrainedColor).lerp(powerColor,T.MathUtils.smoothstep(level,.45,.89));
      feed.surface.color.copy(lineColor);
      feed.surface.opacity=.22 + .62*level;
      feed.nodes.forEach((node,index) => {
        node.visible=incident && index < Math.ceil(level*feed.nodes.length);
        if (node.visible) node.position.copy(feed.path.getPointAt((flowTime*(.22+level*.17)+index/3)%1));
      });
    }

    clinicMark.emissiveIntensity = .12 + unit(power.clinic,1)*1.05;
    for (const lid of city.waterLids) lid.material.emissiveIntensity=unit(power.city,1)*.82;
    const shelterLevel=unit(power.logistics,1);
    for (const lamp of shelterLights) lamp.material.opacity=.12 + shelterLevel*.88;
    coolingWave.visible=incident && shelterLevel>=.78;
    if (coolingWave.visible) {
      const beat=(flowTime*.48)%1;
      const size=10 + beat*3.3;
      coolingWave.scale.set(size,size,1);
      coolingWave.material.opacity=.64 - beat*.34;
    }
    const industry=unit(power.work,1);
    for (const fan of productionFans) fan.rotation.y=industry>=.75 ? flowTime*(1.4+industry*3) : 0;
    const reserve=unit(source.storage,1);
    for (const [index,cell] of chargeCells.entries()) {
      const fraction=T.MathUtils.clamp(reserve*chargeCells.length-index,0,1);
      cell.material.color.copy(constrainedColor).lerp(powerColor,fraction);
      cell.material.opacity=.28 + fraction*.72;
    }
    batteryLine.visible=batteryPulse.visible=incident && unit(source.battery)>0;
    if (batteryPulse.visible) batteryPulse.position.copy(batteryPath.getPointAt((flowTime*.68+.4)%1));
    shuttleRail.visible=incident && shuttleCount>0;
    fleet.forEach((coach,index) => {
      coach.visible=incident && index<shuttleCount;
      if (!coach.visible) return;
      const fraction=(flowTime*.19+(index+.45)/shuttleCount)%1;
      coach.position.copy(shuttlePath.getPointAt(fraction));
      const direction=shuttlePath.getTangentAt(fraction);
      coach.rotation.y=Math.atan2(-direction.z,direction.x);
    });
    turbines.forEach((item,index) => {item.rotation.z=flowTime*(.88+.21*index);});
  }

  function resize() {
    const bounds=canvas.getBoundingClientRect();
    const nextWidth=Math.max(1, Math.round(bounds.width));
    const nextHeight=Math.max(1, Math.round(bounds.height));
    if (nextWidth===width && nextHeight===height) return;
    width=nextWidth;
    height=nextHeight;
    renderer.setSize(width,height,false);
    cameraMoving=true;
  }

  const lookTarget = new T.Vector3();
  const normalPose = () => ({
    x:focusPoint.x, y:focusPoint.y, z:focusPoint.z, heading, tilt, distance:106*scale, fit:1.11,
  });

  function setCamera(pose) {
    camera.aspect=width/height;
    const fit = Math.max(1,pose.fit/camera.aspect);
    const distance = pose.distance*Math.min(fit,1.82);
    const flatDistance = distance*Math.cos(pose.tilt);
    camera.position.set(
      pose.x+flatDistance*Math.sin(pose.heading),
      pose.y+distance*Math.sin(pose.tilt),
      pose.z+flatDistance*Math.cos(pose.heading),
    );
    camera.lookAt(lookTarget.set(pose.x,pose.y,pose.z));
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
  }

  function draw(view) {
    resize();
    const now=performance.now();
    const elapsed=previousDraw ? Math.min((now-previousDraw)/1000,.08) : 0;
    previousDraw=now;
    if (view.running) flowTime+=elapsed;
    if (focusPoint.distanceToSquared(destination)>.0003) {
      focusPoint.lerp(destination,.16);
      cameraMoving=true;
    }
    const cityState=view.citySystem || {};
    const key=JSON.stringify([view.hour,view.selected,cityState]);
    if (!cameraMoving && key===previousKey && !view.running) return false;
    if (!cameraMoving && view.running && now-previousRender<28) return false;
    if (cameraMoving) setCamera(normalPose());
    cameraMoving=false;
    previousKey=key;
    updateCrisis(cityState, view.selected);
    renderer.render(scene,camera);
    previousRender=now;
    return true;
  }

  function project(id) {
    const anchor=districts[id]?.anchor;
    if (!anchor || !width || !height) return {x:0,y:0,visible:false};
    projectPoint.copy(anchor).project(camera);
    return {
      x:(projectPoint.x+1)*width/2,
      y:(1-projectPoint.y)*height/2,
      visible:Math.abs(projectPoint.x)<1.06 && Math.abs(projectPoint.y)<1.06 && Math.abs(projectPoint.z)<1,
    };
  }

  function orbit(dx,dy) {
    heading-=dx*.009;
    tilt=T.MathUtils.clamp(tilt+dy*.006,.38,1.4);
    cameraMoving=true;
  }

  function zoom(delta) {
    scale=T.MathUtils.clamp(scale*Math.exp(delta*.0013),.42,1.65);
    cameraMoving=true;
  }

  function resetCamera() {
    heading=defaultHeading;
    tilt=defaultTilt;
    scale=1;
    destination.copy(defaultFocus);
    cameraMoving=true;
  }

  function focus(id) {
    const data=districts[id];
    if (!data) return;
    destination.set(data.x,1,data.z);
    scale=.54;
    cameraMoving=true;
  }

  function pick(x,y) {
    const bounds=canvas.getBoundingClientRect();
    pointer.set((x-bounds.left)/bounds.width*2-1, 1-(y-bounds.top)/bounds.height*2);
    raycaster.setFromCamera(pointer,camera);
    for (const hit of raycaster.intersectObjects(selectionRoots,true)) {
      let item=hit.object;
      while (item && !item.userData.district) item=item.parent;
      if (item) {
        onPick(item.userData.district);
        break;
      }
    }
  }

  const pointers=new Map();
  let moved=false;
  canvas.addEventListener('pointerdown', (event) => {
    if (event.button!==0 && event.pointerType!=='touch') return;
    if (!pointers.size) moved=false;
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY,travel:0});
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', (event) => {
    const previous=pointers.get(event.pointerId);
    if (!previous) return;
    const dx=event.clientX-previous.x, dy=event.clientY-previous.y;
    const other=[...pointers.entries()].find(([id]) => id!==event.pointerId)?.[1];
    if (other) {
      const before=Math.hypot(previous.x-other.x,previous.y-other.y);
      const after=Math.hypot(event.clientX-other.x,event.clientY-other.y);
      zoom((before-after)*3);
      moved=true;
    } else {
      previous.travel+=Math.hypot(dx,dy);
      if (previous.travel>4) moved=true;
      if (moved) orbit(dx,dy);
    }
    previous.x=event.clientX;
    previous.y=event.clientY;
  });
  canvas.addEventListener('pointerup', (event) => {
    if (!pointers.delete(event.pointerId)) return;
    if (!moved && !pointers.size) pick(event.clientX,event.clientY);
  });
  canvas.addEventListener('pointercancel', (event) => pointers.delete(event.pointerId));
  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    zoom(event.deltaY*(event.deltaMode===1 ? 15 : 1));
  }, {passive:false});
  renderer.shadowMap.needsUpdate=true;

  return {draw,project,orbit,zoom,resetCamera,focus};
}
</script>

<script>
(() => {
  const root = document.getElementById('city-system-2031');
  const get = (name) => root.querySelector('[data-' + name + ']');
  const all = (name) => Array.from(root.querySelectorAll('[data-' + name + ']'));
  const modeButtons = all('mode');
  const policyButtons = all('policy');
  const valueTopics = all('value-topic');
  const valueTiles = all('value-tile').map((tile) => Array.from(tile.children));
  const pins = all('pin');
  const names = {city:'供水站', clinic:'医院', home:'社区', logistics:'避暑接驳', work:'工厂'};
  const modes = {isolated:'按比例限电', coordinated:'AI 联合调度'};
  const policyNames = {care:'民生优先', industry:'生产优先'};
  const valueHours = {forecast:17,coordination:16,tradeoff:16};
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const state = {
    mode:'coordinated',policy:'care',forecastEnabled:true,
    index:0,playing:false,selected:null,valueOpen:false,valueTopic:'coordination',
    voice:false,
  };
  const hourDuration = 3.4;
  const planCache = new Map();
  const formatter = new Intl.NumberFormat('zh-CN');
  const canvas = get('canvas');
  const audio = get('voice-audio');
  let scene;
  let stepStarted = 0;
  let lastDraw = 0;
  let snapshot;
  let citySystem;
  let narrationCue = null;
  let narrationAttempt = 0;
  let narrationStarted = 0;
  let narrationActive = false;

  function plan(mode, policy = state.policy, forecastEnabled = state.forecastEnabled) {
    const key = [mode,policy,mode === 'coordinated' && forecastEnabled].join(':');
    if (!planCache.has(key)) planCache.set(key, simulateCitySystem({mode,policy,forecastEnabled}));
    return planCache.get(key);
  }

  const hours = plan(state.mode);
  const timeText = (hour) => String(hour).padStart(2,'0') + ':00';
  const set = (key, value) => { const el=get(key); if (el.textContent !== String(value)) el.textContent=value; };
  const forecastCue = () => state.policy === 'industry' ? 'forecastIndustry' : 'forecast';
  const coordinationCue = () => state.policy === 'industry' ? 'summary' : 'coordination';

  function timelineCue() {
    if (state.index === 0) return 'intro';
    if (state.index === hours.length - 1) return 'summary';
    if (state.index < 3) return 'onset';
    if (hours[state.index].hour === valueHours.forecast) return state.mode === 'coordinated' ? forecastCue() : 'summary';
    if (state.mode === 'coordinated' && state.policy === 'industry') return 'tradeoff';
    return coordinationCue();
  }

  function currentCue() {
    if (state.playing || !state.valueOpen || hours[state.index].hour !== valueHours[state.valueTopic]) return timelineCue();
    if (state.valueTopic === 'forecast') return forecastCue();
    return state.valueTopic === 'coordination' ? coordinationCue() : 'tradeoff';
  }

  function speak(cue, {restart = false, resume = false} = {}) {
    const clip = cityNarration[cue];
    if (!state.voice || !clip) return;
    const same = narrationCue === cue;
    if (same && !restart && (!resume || !audio.paused || audio.ended)) return;
    const attempt = ++narrationAttempt;
    if (!same || restart) {
      audio.pause();
      audio.src='data:audio/ogg;base64,' + clip.audio;
      narrationCue=cue;
      set('voice-transcript',clip.text);
    }
    narrationStarted=performance.now();
    narrationActive=true;
    set('voice-status','正在加载');
    audio.play().then(() => {
      if (attempt === narrationAttempt) set('voice-status','正在讲解');
    }).catch(() => {
      if (attempt !== narrationAttempt) return;
      narrationActive=false;
      set('voice-status','播放未开始，可点重听');
    });
  }

  function pauseNarration() {
    narrationAttempt += 1;
    audio.pause();
    if (narrationActive) set('voice-status','讲解暂停');
    narrationActive=false;
  }

  function narrationHoldsTimeline(now) {
    return state.voice && narrationActive && now - narrationStarted < (cityNarration[narrationCue].duration + 1.5) * 1000;
  }

  function toggleNarration() {
    state.voice=!state.voice;
    get('voice').setAttribute('aria-pressed',String(state.voice));
    get('voice-notes').hidden=!state.voice;
    set('voice',state.voice ? '关讲解' : '听讲解');
    if (state.voice) speak(currentCue(),{restart:true});
    else pauseNarration();
  }

  const ticks = hours.map((hour) => {
    const item = document.createElement('li');
    const button = document.createElement('button');
    const label = document.createElement('span');
    const description = document.createElement('small');
    button.type='button';
    label.textContent=timeText(hour.hour);
    description.textContent=hour.title;
    button.setAttribute('aria-label',label.textContent + ' ' + hour.title);
    button.append(label,description);
    button.addEventListener('click',() => selectHour(hour.index));
    item.append(button);
    get('timeline').append(item);
    return button;
  });

  function relative(amount, unit) {
    return amount === 0 ? '与对照相同' : (amount > 0 ? '多 ' : '少 ') + formatter.format(Math.abs(amount)) + ' ' + unit;
  }

  function forecastEvidence() {
    const ahead = plan('coordinated',state.policy,true);
    const immediate = plan('coordinated',state.policy,false);
    const early = ahead.find((step) => step.supply.batteryHeld > 0) ?? ahead[1];
    const [current, other] = state.forecastEnabled ? [ahead,immediate] : [immediate,ahead];
    const now = current[state.index];
    const peer = other[state.index];
    const final = ahead.at(-1).metrics;
    const baseline = immediate.at(-1).metrics;
    const productionGap = final.workDeferred + final.workUnserved - baseline.workDeferred - baseline.workUnserved;
    const focus = state.policy === 'care' ? 'home' : 'work';
    return {
      current:state.forecastEnabled ? '提前规划' : '即时补缺',
      other:state.forecastEnabled ? '即时补缺' : '提前规划',
      action:state.forecastEnabled ? '关掉提前规划' : '恢复提前规划',
      values:[
        [timeText(early.hour) + ' 储能余量',current[early.index].supply.batteryRemaining,other[early.index].supply.batteryRemaining,'MWh'],
        [timeText(now.hour) + ' 储能供电',now.supply.battery,peer.supply.battery,'MW'],
        [timeText(now.hour) + ' ' + names[focus] + '供电',now.districts[focus].allocated,peer.districts[focus].allocated,'MW'],
      ],
      note:'到 18:00，提前规划的降温服务' + relative(final.coolingPeople-baseline.coolingPeople,'人次')
        + '，当时未供给生产的电量' + relative(productionGap,'MWh') + '。',
    };
  }

  function coordinationEvidence() {
    const otherMode = state.mode === 'coordinated' ? 'isolated' : 'coordinated';
    const current = plan(state.mode);
    const alternate = plan(otherMode);
    const previous = Math.max(0,state.index-1);
    const earlier = current[previous];
    const peer = alternate[state.index];
    const avoided = Math.abs(snapshot.supply.derating-peer.supply.derating);
    const time = timeText(snapshot.hour);
    return {
      current:modes[state.mode],
      other:modes[otherMode],
      action:otherMode === 'coordinated' ? '切到联合调度' : '切到按比例限电',
      values:[
        [timeText(earlier.hour) + ' 水泵供电',earlier.districts.city.allocated,alternate[previous].districts.city.allocated,'MW'],
        [time + ' 电网出力',snapshot.supply.grid,peer.supply.grid,'MW'],
        [time + ' 避暑接驳',snapshot.shuttles,peer.shuttles,'辆'],
      ],
      note:avoided
        ? '水泵最低需 ' + earlier.waterMinimum + ' MW。联合调度持续给水泵保供，让此时电网少损失 ' + avoided + ' MW。'
        : '水泵最低需 ' + earlier.waterMinimum + ' MW。功率不足会让后续电网进一步降容，也会让避暑接驳停运。',
    };
  }

  function tradeoffEvidence() {
    const otherPolicy = state.policy === 'care' ? 'industry' : 'care';
    const other = plan('coordinated',otherPolicy)[state.index];
    const time = timeText(snapshot.hour);
    return {
      current:policyNames[state.policy],
      other:policyNames[otherPolicy],
      action:'切到' + policyNames[otherPolicy],
      values:[
        [time + ' 医院供电',snapshot.districts.clinic.allocated,other.districts.clinic.allocated,'MW'],
        [time + ' 工厂供电',snapshot.districts.work.allocated,other.districts.work.allocated,'MW'],
        [time + ' 避暑接驳',snapshot.shuttles,other.shuttles,'辆'],
      ],
      note:snapshot.supply.total === other.supply.total
        ? '两种规则此时都只有 ' + snapshot.supply.total + ' MW。你决定优先保谁，系统按规则分配电力。'
        : '优先级同时改变配电顺序和储能投放时机。当前可用供电分别为 ' + snapshot.supply.total + ' 和 ' + other.supply.total + ' MW。',
    };
  }

  function renderValue() {
    get('value-panel').hidden=!state.valueOpen;
    get('value-open').setAttribute('aria-expanded',String(state.valueOpen));
    set('value-open',state.valueOpen ? '收起价值对照' : '看 AI 的价值');
    root.toggleAttribute('data-value-active',state.valueOpen);
    if (!state.valueOpen) return;
    for (const button of valueTopics) button.setAttribute('aria-pressed',String(button.dataset.valueTopic === state.valueTopic));
    const evidence = {
      forecast:forecastEvidence,coordination:coordinationEvidence,tradeoff:tradeoffEvidence,
    }[state.valueTopic]();
    set('value-current','当前 · ' + evidence.current);
    set('value-other','对照 · ' + evidence.other);
    set('value-compare',evidence.action);
    set('value-note',evidence.note);
    for (const [index,[label,value,other,unit]] of evidence.values.entries()) {
      const [heading,main,comparison,bars] = valueTiles[index];
      heading.textContent=label;
      main.textContent=formatter.format(value) + ' ' + unit;
      comparison.textContent='对照 ' + formatter.format(other) + ' ' + unit;
      const range = Math.max(1,value,other);
      bars.firstElementChild.style.width=(value/range*100) + '%';
      bars.lastElementChild.style.width=(other/range*100) + '%';
    }
  }

  function renderDifference(key, amount, unit, betterDirection) {
    set(key,relative(amount,unit));
    const direction = amount * betterDirection;
    get(key).dataset.difference=direction > 0 ? 'positive' : direction < 0 ? 'negative' : '';
  }

  function render() {
    snapshot = plan(state.mode)[state.index];
    const otherMode = state.mode === 'coordinated' ? 'isolated' : 'coordinated';
    const other = plan(otherMode)[state.index];
    const supply = snapshot.supply;
    const initial = state.index === 0;
    const time = timeText(snapshot.hour);
    const power=Object.fromEntries(Object.entries(snapshot.districts).map(([id,district]) => [id,district.level]));
    citySystem={
      mode:state.mode,policy:state.policy,stage:state.index,power,
      shuttles:snapshot.shuttles,storage:supply.batteryRemaining/supply.batteryCapacity,
      battery:supply.battery/10,grid:Math.min(1,supply.grid/supply.demand),
      outage:!snapshot.waterReady,waterReady:snapshot.waterReady,
    };
    for (const button of modeButtons) button.setAttribute('aria-pressed',String(button.dataset.mode === state.mode));
    for (const button of policyButtons) button.setAttribute('aria-pressed',String(button.dataset.policy === state.policy));
    get('policy-control').hidden=state.mode === 'isolated';
    get('start').hidden=!initial;
    get('facts').hidden=initial;
    root.toggleAttribute('data-active',!initial);
    set('hour',time);
    set('scene-tag',initial ? '热浪将至' : snapshot.title + (state.mode === 'coordinated' && !state.forecastEnabled ? ' · 即时补缺' : ''));
    let title = '关键服务持续运转';
    if (initial) title='全城缺电，先保谁？';
    else if (!snapshot.waterReady) title='水泵停转，危机扩散';
    else if (snapshot.shiftedWork >= 10) title='工厂错峰，保住民生';
    else if (state.mode === 'coordinated' && state.policy === 'industry' && supply.gap) title='优先把电留给生产';
    const forecastView = state.valueOpen && state.valueTopic === 'forecast';
    if (forecastView && !initial) {
      if (snapshot.forecastEnabled && supply.battery) title='留到此刻的储能开始供电';
      else if (!supply.battery && !supply.batteryRemaining) {
        title=snapshot.districts.home.level < 1 ? '储能用尽，社区供电收紧' : '储能用尽，电网继续供电';
      }
    }
    set('scene-title',title);
    set('supply',supply.total);
    set('demand','/ ' + supply.demand + ' MW');
    set('storage','余 ' + supply.batteryRemaining + ' MWh');
    get('meter-grid').style.width = Math.min(100,supply.grid / supply.demand * 100) + '%';
    get('meter-battery').style.width = supply.battery / supply.demand * 100 + '%';
    set('water',snapshot.waterReady ? '水泵保供' : supply.derating ? '水泵停转 · 电网再降 ' + supply.derating + ' MW' : '水泵功率不足');
    get('water').toggleAttribute('data-off',!snapshot.waterReady);
    set('buses',snapshot.shuttles ? '避暑接驳 ' + snapshot.shuttles + ' 辆' : '避暑接驳停运');
    get('buses').toggleAttribute('data-off',snapshot.shuttles === 0);
    const focusDistrict = forecastView && state.policy === 'care' ? 'home' : 'work';
    const focusPower = snapshot.districts[focusDistrict];
    set('industry',names[focusDistrict] + ' ' + Math.round(focusPower.level * 100) + '%');
    get('industry').toggleAttribute('data-off',focusPower.status === 'critical');
    for (const pin of pins) {
      const district = snapshot.districts[pin.dataset.pin];
      const percent = Math.round(district.level * 100);
      pin.querySelector('b').textContent = percent + '%';
      pin.dataset.status = district.status;
      pin.setAttribute('aria-pressed',String(state.selected === pin.dataset.pin));
      pin.setAttribute('aria-label',names[pin.dataset.pin] + ' 供电 ' + percent + '%');
    }
    for (const [index,button] of ticks.entries()) {
      if (index === state.index) button.setAttribute('aria-current','step');
      else button.removeAttribute('aria-current');
    }
    const playback = get('play');
    const atEnd = state.index === hours.length - 1;
    playback.textContent = state.playing ? 'Ⅱ' : atEnd ? '↻' : '▶︎';
    playback.setAttribute('aria-label',state.playing ? '暂停时间轴' : atEnd ? '重播推演' : '播放推演');
    const district = snapshot.districts[state.selected];
    get('action-row').hidden=state.valueOpen && !district;
    set('action-label',district ? names[state.selected] : '当前动作');
    set('action',district ? '分到 ' + district.allocated + ' MW，需求 ' + district.demand + ' MW。' : snapshot.action);
    set('metrics-hour',time);
    set('comparison','对照 · ' + modes[otherMode] + (otherMode === 'coordinated' ? '／' + policyNames[state.policy] : ''));
    set('cooling',formatter.format(snapshot.metrics.coolingPeople));
    renderDifference('cooling-compare',snapshot.metrics.coolingPeople - other.metrics.coolingPeople,'人次',1);
    set('clinic',snapshot.metrics.clinicHoursAtRisk);
    renderDifference('clinic-compare',snapshot.metrics.clinicHoursAtRisk - other.metrics.clinicHoursAtRisk,'小时',-1);
    set('work',snapshot.metrics.workDeferred);
    set('work-unserved','另有 ' + snapshot.metrics.workUnserved + ' MWh 未供');
    renderValue();
  }

  function selectHour(index) {
    state.playing=false;
    state.index=index;
    state.selected=null;
    scene?.resetCamera();
    render();
    speak(currentCue());
  }

  function play() {
    if (state.playing) {
      state.playing=false;
      pauseNarration();
    } else {
      const restart = state.index === 0 || state.index === hours.length - 1;
      if (restart) state.index=1;
      state.selected=null;
      state.playing=true;
      stepStarted=performance.now();
      speak(timelineCue(),{restart,resume:true});
    }
    render();
  }

  function setMode(mode) {
    if (state.mode === mode) return;
    state.mode=mode;
    if (mode === 'isolated' && state.valueOpen) {
      state.valueTopic='coordination';
      state.forecastEnabled=true;
    }
    state.playing=false;
    state.selected=null;
    render();
    speak(currentCue());
  }

  function setPolicy(policy) {
    if (state.policy === policy) return;
    state.policy=policy;
    state.playing=false;
    state.selected=null;
    render();
    speak(currentCue());
  }

  function showValue(topic) {
    state.valueOpen=true;
    state.valueTopic=topic;
    state.mode='coordinated';
    state.forecastEnabled=true;
    selectHour(hours.find((step) => step.hour === valueHours[topic]).index);
  }

  function compareValue() {
    if (state.valueTopic === 'coordination') {
      setMode(state.mode === 'coordinated' ? 'isolated' : 'coordinated');
    } else if (state.valueTopic === 'tradeoff') {
      setPolicy(state.policy === 'care' ? 'industry' : 'care');
    } else {
      state.forecastEnabled=!state.forecastEnabled;
      state.playing=false;
      render();
      speak(currentCue());
    }
  }

  function pick(id) {
    if (!names[id]) return;
    state.selected=state.selected === id ? null : id;
    if (state.selected) scene?.focus(id);
    else scene?.resetCamera();
    render();
  }

  function placePins() {
    const bounds = canvas.getBoundingClientRect();
    const hud = get('hud').getBoundingClientRect();
    const occupied = [{x:hud.left-bounds.left-4,y:hud.top-bounds.top-4,right:hud.right-bounds.left+4,bottom:hud.bottom-bounds.top+4}];
    const ordered = [...pins].sort((a,b) => Number(b.dataset.pin === state.selected) - Number(a.dataset.pin === state.selected));
    for (const pin of ordered) {
      const point = scene.project(pin.dataset.pin);
      pin.hidden = !point?.visible;
      if (pin.hidden) continue;
      const halfW=pin.offsetWidth/2;
      const halfH=pin.offsetHeight/2;
      const x=Math.max(halfW+2,Math.min(bounds.width-halfW-2,point.x));
      const base=Math.max(halfH+2,Math.min(bounds.height-halfH-2,point.y));
      const y=[0,-1,1,-2,2,-3,3].map((offset) => base+offset*(pin.offsetHeight+4)).find((candidate) =>
        candidate >= halfH && candidate < bounds.height-halfH-32 && occupied.every((box) =>
          x+halfW+3 < box.x || x-halfW-3 > box.right || candidate+halfH+3 < box.y || candidate-halfH-3 > box.bottom));
      pin.hidden=y === undefined;
      if (pin.hidden) continue;
      pin.style.left=x + 'px';
      pin.style.top=y + 'px';
      occupied.push({x:x-halfW,y:y-halfH,right:x+halfW,bottom:y+halfH});
    }
  }

  function draw(now) {
    if (state.playing && now-stepStarted >= hourDuration*1000 && !narrationHoldsTimeline(now)) {
      state.index=Math.min(hours.length-1,state.index+1);
      stepStarted=now;
      if (state.index === hours.length-1) state.playing=false;
      render();
      speak(timelineCue());
    }
    if (scene && now-lastDraw >= 32) {
      if (scene.draw({hour:snapshot.hour,selected:state.selected,running:state.index > 0 && !reducedMotion.matches,links:snapshot.flows,citySystem})) placePins();
      lastDraw=now;
    }
    requestAnimationFrame(draw);
  }

  for (const button of modeButtons) button.addEventListener('click',() => setMode(button.dataset.mode));
  for (const button of policyButtons) button.addEventListener('click',() => setPolicy(button.dataset.policy));
  for (const button of valueTopics) button.addEventListener('click',() => showValue(button.dataset.valueTopic));
  get('voice').addEventListener('click',toggleNarration);
  get('voice-replay').addEventListener('click',() => speak(currentCue(),{restart:true}));
  audio.addEventListener('ended',() => {
    narrationActive=false;
    if (state.voice) set('voice-status','讲解已播完');
  });
  get('value-open').addEventListener('click',() => {
    if (!state.valueOpen) showValue('coordination');
    else {
      state.valueOpen=false;
      render();
      speak(currentCue());
    }
  });
  get('value-compare').addEventListener('click',compareValue);
  for (const pin of pins) pin.addEventListener('click',() => pick(pin.dataset.pin));
  get('start').addEventListener('click',() => { play(); get('play').focus({preventScroll:true}); });
  get('play').addEventListener('click',play);
  get('reset').addEventListener('click',() => { state.selected=null; scene?.resetCamera(); render(); });
  try {
    scene=createWorldScene(canvas,pick);
  } catch (error) {
    get('fallback').hidden=false;
    get('reset').hidden=true;
    for (const pin of pins) pin.hidden=true;
    console.error(error);
  }
  render();
  requestAnimationFrame(draw);
})();
</script>
