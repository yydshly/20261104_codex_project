<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171923">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23171923'/%3E%3Cpath d='M7 25V12h4V7h3v5h4V7h3v5h4v13H7Zm7 0v-6h4v6' stroke='%23dfbb7c' fill='none'/%3E%3C/svg%3E">
  <meta name="description" content="暮色之堡 3D 原型，支持第一人称从渔屋码头登船、渡湖入堡、沿螺旋楼梯登塔，以及湖岸和旧塔遗迹探索。">
  <title>暮色之堡 · The Last Light</title>
  <!-- STYLES -->
</head>
<body>
  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-mark" viewBox="0 0 32 32"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13L16 2Z"/><path d="M9 22v-8h3v-4h2v4h4v-4h2v4h3v8M7.5 22h17M14.5 22v-4a1.5 1.5 0 0 1 3 0v4"/></symbol>
    <symbol id="icon-orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.8 8.1C18.4 5.4 15.4 4 12 4a8 8 0 0 0-8 8m.2 3.9C5.6 18.6 8.6 20 12 20a8 8 0 0 0 8-8M20 4v4h-4M4 20v-4h4"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/><path d="M16 4v4m-2-2h4"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2m0 15v2m9.5-9.5h-2m-15 0h-2m16.2 6.7-1.4-1.4M6.7 6.7 5.3 5.3m13.4 0-1.4 1.4M6.7 17.3l-1.4 1.4"/></symbol>
    <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="icon-pointer" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="17" rx="5"/><path d="M12 7v4"/></symbol>
    <symbol id="icon-zoom" viewBox="0 0 24 24"><circle cx="10" cy="10" r="5.5"/><path d="m14 14 5 5m-9-11v4m-2-2h4"/></symbol>
    <symbol id="icon-walk" viewBox="0 0 24 24"><circle cx="13" cy="4" r="1.8"/><path d="m7 12 2.1-3.1 3.6-1.5 2.7 3.1 3.2 1.2M12.6 7.7l-1.5 5.7 3.4 3.1 1.2 4M11.1 13.4 9.4 17l-3 3.6"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="icon-boat" viewBox="0 0 24 24"><path d="M3 14h18l-3.5 4h-11L3 14Zm4-1 8-8m-2 0 2-2 2 2-2 2M2.5 21c2 0 2-.7 4-.7s2 .7 4 .7 2-.7 4-.7 2 .7 4 .7h3"/></symbol>
    <symbol id="icon-bearing" viewBox="0 0 24 24"><path d="m12 3 5.5 15-5.5-3-5.5 3L12 3Z"/></symbol>
  </svg>

  <main id="experience" class="experience" data-mode="overview" aria-label="暮色之堡三维场景">
    <div id="scene" class="scene"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="#icon-mark"></use></svg>
        <div><span class="brand-title">暮色之堡</span><span class="brand-note">THE LAST LIGHT</span></div>
      </div>
      <div class="top-actions" aria-label="场景设置">
        <button class="tool" id="light" type="button" aria-pressed="false" aria-label="切换暮色与月夜" title="切换暮色与月夜">
          <svg aria-hidden="true"><use href="#icon-moon"></use></svg><span>月夜</span>
        </button>
        <button class="tool" id="orbit" type="button" aria-pressed="false" aria-label="自动环绕" title="自动环绕">
          <svg aria-hidden="true"><use href="#icon-orbit"></use></svg><span>环绕</span>
        </button>
        <button class="tool icon-only" id="fullscreen" type="button" aria-label="全屏" title="全屏">
          <svg aria-hidden="true"><use href="#icon-fullscreen"></use></svg>
        </button>
        <button class="tool walk-toggle" id="walk-toggle" type="button" aria-pressed="false" aria-label="进入第一人称漫游" title="第一人称漫游">
          <svg aria-hidden="true"><use href="#icon-walk"></use></svg><span>漫游</span>
        </button>
      </div>
    </header>

    <section class="intro" aria-labelledby="title">
      <p class="chapter"><span></span>01 / THE KEEP</p>
      <h1 id="title">暮色之堡</h1>
      <p class="subtitle" id="subtitle">余晖越过塔尖，群山倒映在湖中。</p>
      <a class="notes-link" href="world-notes.html">阅读世界构想与探索札记 ↗</a>
    </section>

    <section class="walk-location" id="walk-location" aria-labelledby="walk-stage" hidden>
      <p class="chapter"><span></span><b id="walk-chapter">01 / 漫游</b></p>
      <h2 id="walk-stage" aria-live="polite">渔屋码头</h2>
      <p id="walk-direction">沿木栈桥走到小船旁，即可登船前往城堡。</p>
    </section>

    <div class="walk-reticle" id="walk-reticle" aria-hidden="true" hidden></div>

    <div class="boat-course" id="boat-course" hidden>
      <svg id="boat-bearing" aria-hidden="true"><use href="#icon-bearing"></use></svg>
      <div><span>驶向</span><strong id="boat-destination">城堡栈台</strong></div>
      <span class="boat-distance" id="boat-distance"></span>
    </div>

    <button class="tool boat-action" id="boat-action" type="button" aria-keyshortcuts="F" hidden>
      <svg aria-hidden="true"><use href="#icon-boat"></use></svg><span>登船</span><kbd>F</kbd>
    </button>

    <div class="walk-pad" id="walk-pad" role="group" aria-label="触屏移动" hidden>
      <button class="pad-up" data-walk-key="KeyW" type="button" aria-label="向前"><svg aria-hidden="true"><use href="#icon-chevron"></use></svg></button>
      <button class="pad-left" data-walk-key="KeyA" type="button" aria-label="向左"><svg aria-hidden="true"><use href="#icon-chevron"></use></svg></button>
      <button class="pad-down" data-walk-key="KeyS" type="button" aria-label="向后"><svg aria-hidden="true"><use href="#icon-chevron"></use></svg></button>
      <button class="pad-right" data-walk-key="KeyD" type="button" aria-label="向右"><svg aria-hidden="true"><use href="#icon-chevron"></use></svg></button>
    </div>

    <footer class="bottom-bar">
      <div class="scene-state" aria-live="polite"><i></i><span id="time-label">暮色</span><span class="state-divider"></span><span id="time-clock">18:42</span></div>
      <div class="camera" role="group" aria-label="观察视角">
        <button type="button" data-view="wide" aria-pressed="true"><small>01</small>全景</button>
        <button type="button" data-view="gate" aria-pressed="false"><small>02</small>城门</button>
        <button type="button" data-view="tower" aria-pressed="false"><small>03</small>塔楼</button>
        <button type="button" data-view="lake" aria-pressed="false"><small>04</small>湖区</button>
      </div>
      <div class="hints" aria-hidden="true">
        <span><svg><use href="#icon-pointer"></use></svg>拖动旋转</span>
        <span><svg><use href="#icon-zoom"></use></svg>滚轮缩放</span>
      </div>
      <div class="walk-help" id="walk-help" hidden>
        <span class="walk-key-help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span id="move-help">移动</span></span>
        <span class="walk-touch-help" id="touch-move-help">按住箭头移动</span>
        <span><span class="walk-turn-keys">Q / E 或</span>拖动转头</span>
      </div>
      <button class="tool walk-reset" id="walk-reset" type="button" hidden>返回起点</button>
    </footer>

    <div class="status" id="status" role="status"><i></i><span>正在绘制城堡</span></div>
  </main>
  <!-- THIRD PARTY LICENSE -->
  <!-- SCENE -->
</body>
</html>
