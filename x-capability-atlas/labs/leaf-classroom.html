    <header class="masthead"><p class="eyebrow">叶片观察 / 05</p><span class="tag">三幅同示意比例 · 离线课堂</span></header>
    <h1>看见叶片气孔的开合</h1>
    <p class="lead">沿三幅图的同一条标线，比较两侧保卫细胞之间的开口。</p>
    <section class="question" aria-labelledby="question-title">
      <div><p class="eyebrow">先观察，再核对</p><h2 id="question-title">第 03 幅中，气体从 A 还是 B 处进出？</h2></div>
      <div class="controls">
        <button type="button" id="measure-toggle" aria-pressed="true" aria-controls="fields">测量标线</button>
        <button type="button" id="reveal-toggle" class="reveal" aria-expanded="false" aria-controls="answer">揭晓答案</button>
      </div>
    </section>
    <div class="fields" id="fields">
      <figure class="field">
        <div class="sample"><svg viewBox="0 0 480 316" role="img" aria-label="闭合状态，两个保卫细胞几乎相接"><use href="#leaf-closed-field"/><use class="measurement" href="#leaf-closed-measure"/></svg></div>
        <figcaption><strong>01 · 闭合</strong><span>几乎看不到缝隙</span></figcaption>
      </figure>
      <figure class="field">
        <div class="sample"><svg viewBox="0 0 480 316" role="img" aria-label="开始开启状态，两侧保卫细胞之间出现窄缝"><use href="#leaf-middle-field"/><use class="measurement" href="#leaf-middle-measure"/></svg></div>
        <figcaption><strong>02 · 开始开启</strong><span>中间出现窄缝</span></figcaption>
      </figure>
      <figure class="field">
        <div class="sample">
          <svg viewBox="0 0 480 316" role="img" aria-label="进一步开启状态，中间孔隙明显变宽"><use href="#leaf-open-field"/><use class="measurement" href="#leaf-open-measure"/><use id="annotations" href="#leaf-open-annotations" hidden/></svg>
          <button type="button" class="pin" style="--x:28.9583%;--y:67.7215%" data-option="A" aria-label="A，左侧绿色结构" aria-pressed="false">A</button>
          <button type="button" class="pin" style="--x:50.0000%;--y:67.4051%" data-option="B" aria-label="B，中央深色结构" aria-pressed="false">B</button>
        </div>
        <figcaption><strong>03 · 进一步开启</strong><span>孔隙明显变宽</span></figcaption>
      </figure>
    </div>
    <p class="selection" id="selection" role="status">请先在第 03 幅图上选择 A 或 B。</p>
    <section class="answer" id="answer" aria-labelledby="answer-title" hidden>
      <h2 id="answer-title">B · 两侧保卫细胞之间的气孔孔隙</h2>
      <p>沿同一条标线从左往右比较。第 01 幅几乎看不到缝隙，第 02 幅出现窄缝，第 03 幅的深色开口更宽。气体经由中间孔隙进出。</p>
    </section>
    <footer class="evidence"><span>原创结构示意，未按真实尺度绘制。标线用于比较孔隙宽度。</span><a href="https://doi.org/10.1038/s41598-023-34273-x">原理参考 · Scientific Reports · DOI 10.1038/s41598-023-34273-x</a></footer>
  </main>
  <script>
    const pins = [...document.querySelectorAll('.pin')];
    const answer = document.getElementById('answer');
    const annotations = document.getElementById('annotations');
    const selection = document.getElementById('selection');
    const reveal = document.getElementById('reveal-toggle');
    const measure = document.getElementById('measure-toggle');
    let choice = '';

    for (const pin of pins) pin.addEventListener('click', () => {
      choice = pin.dataset.option;
      for (const item of pins) item.setAttribute('aria-pressed', String(item === pin));
      selection.textContent = `已选择 ${choice}。揭晓后对照图中标注。`;
    });
    reveal.addEventListener('click', () => {
      const showing = answer.hidden;
      answer.hidden = !showing;
      annotations.toggleAttribute('hidden', !showing);
      reveal.setAttribute('aria-expanded', String(showing));
      reveal.textContent = showing ? '再做一次' : '揭晓答案';
      for (const pin of pins) {
        pin.hidden = showing;
        if (!showing) pin.setAttribute('aria-pressed', 'false');
      }
      if (!showing) choice = '';
      const feedback = { A: 'A 指向保卫细胞。请再找它们之间的深色孔隙。', B: '选对了。B 指向两侧保卫细胞之间的孔隙。' };
      selection.textContent = showing ? feedback[choice] || '已显示气孔位置与对照说明。' : '请先在第 03 幅图上选择 A 或 B。';
    });
    measure.addEventListener('click', () => {
      const showing = measure.getAttribute('aria-pressed') !== 'true';
      measure.setAttribute('aria-pressed', String(showing));
      for (const line of document.querySelectorAll('.measurement')) line.toggleAttribute('hidden', !showing);
    });
  </script>
