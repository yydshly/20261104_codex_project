<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630"><rect width="1000" height="630" fill="#e9f0ee"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="50" y="53" font-size="15" fill="#176e73" font-weight="600">见全 / JIANQUAN</text><text x="50" y="108" font-size="34" fill="#19343d" font-weight="600">把生成与查证分别看清楚。</text><rect x="50" y="209" width="200" height="172" rx="12" fill="#fff" stroke="#d9e1df"/><text x="72" y="252" font-size="17" fill="#176e73" font-weight="400">01</text><text x="72" y="300" font-size="29" fill="#19343d" font-weight="600">问题</text><text x="72" y="345" font-size="16" fill="#617980" font-weight="400">今天问了什么</text><path d="M256 296h20m-6 -5l6 5l-6 5" fill="none" stroke="#176e73" stroke-width="2"/><rect x="283" y="209" width="200" height="172" rx="12" fill="#fff" stroke="#d9e1df"/><text x="305" y="252" font-size="17" fill="#176e73" font-weight="400">02</text><text x="305" y="300" font-size="29" fill="#19343d" font-weight="600">上下文</text><text x="305" y="345" font-size="16" fill="#617980" font-weight="400">收到了哪些材料</text><path d="M489 296h20m-6 -5l6 5l-6 5" fill="none" stroke="#176e73" stroke-width="2"/><rect x="516" y="209" width="200" height="172" rx="12" fill="#fff" stroke="#d9e1df"/><text x="538" y="252" font-size="17" fill="#176e73" font-weight="400">03</text><text x="538" y="300" font-size="29" fill="#19343d" font-weight="600">逐步生成</text><text x="538" y="345" font-size="16" fill="#617980" font-weight="400">组织后续文字</text><path d="M722 296h20m-6 -5l6 5l-6 5" fill="none" stroke="#176e73" stroke-width="2"/><rect x="749" y="209" width="200" height="172" rx="12" fill="#fff" stroke="#d9e1df"/><text x="771" y="252" font-size="17" fill="#176e73" font-weight="400">04</text><text x="771" y="300" font-size="29" fill="#19343d" font-weight="600">回答</text><text x="771" y="345" font-size="16" fill="#617980" font-weight="400">形成了这句话</text><rect x="50" y="425" width="900" height="95" rx="12" fill="#dbe8df" stroke="#dbe8df"/><text x="80" y="467" font-size="27" fill="#176e73" font-weight="600">文字通顺，不自动说明来源正确。</text><text x="80" y="499" font-size="19" fill="#617980" font-weight="400">模型实际收到什么、原文是否适用，仍需继续核查。</text><text x="50" y="594" font-size="15" fill="#617980" font-weight="400">教学虚构 · 原创示意图 · 非产品界面截图</text><text x="893" y="594" font-size="15" fill="#176e73" font-weight="400">02 / 04</text></g></svg>