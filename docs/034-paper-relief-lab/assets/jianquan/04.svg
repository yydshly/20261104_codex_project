<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630"><rect width="1000" height="630" fill="#e9f0ee"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="50" y="53" font-size="15" fill="#176e73" font-weight="600">见全 / JIANQUAN</text><text x="50" y="108" font-size="34" fill="#19343d" font-weight="600">形成判断，也保留判断的边界。</text><rect x="50" y="183" width="280" height="272" rx="12" fill="#fff" stroke="#d9e1df"/><text x="75" y="229" font-size="28" fill="#176e73" font-weight="600">观察</text><text x="75" y="299" font-size="20" fill="#19343d" font-weight="500">原回答 18:00</text><text x="75" y="344" font-size="18" fill="#617980" font-weight="400">现行周日安排 16:00</text><rect x="360" y="183" width="280" height="272" rx="12" fill="#fff" stroke="#d9e1df"/><text x="385" y="229" font-size="28" fill="#176e73" font-weight="600">解释</text><text x="385" y="299" font-size="20" fill="#19343d" font-weight="500">旧资料或条件遗漏？</text><text x="385" y="344" font-size="18" fill="#617980" font-weight="400">原因仍需要更多记录</text><rect x="670" y="183" width="280" height="272" rx="12" fill="#fff" stroke="#d9e1df"/><text x="695" y="229" font-size="28" fill="#176e73" font-weight="600">判断</text><text x="695" y="299" font-size="20" fill="#19343d" font-weight="500">采用本例适用的 16:00</text><text x="695" y="344" font-size="18" fill="#617980" font-weight="400">说明条件与来源</text><rect x="50" y="483" width="900" height="64" rx="12" fill="#19343d" stroke="#19343d"/><text x="80" y="524" font-size="25" fill="#fff" font-weight="400">从一个问题，继续走向机制、证据与关联。</text><text x="50" y="594" font-size="15" fill="#617980" font-weight="400">教学虚构 · 原创示意图 · 非产品界面截图</text><text x="893" y="594" font-size="15" fill="#176e73" font-weight="400">04 / 04</text></g></svg>