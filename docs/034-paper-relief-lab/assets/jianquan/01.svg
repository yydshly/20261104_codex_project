<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630"><rect width="1000" height="630" fill="#e9f0ee"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="50" y="53" font-size="15" fill="#176e73" font-weight="600">见全 / JIANQUAN</text><text x="50" y="108" font-size="34" fill="#19343d" font-weight="600">先看见一个值得追问的差异。</text><rect x="50" y="149" width="900" height="73" rx="12" fill="#19343d" stroke="#19343d"/><text x="80" y="194" font-size="26" fill="#fff" font-weight="400">这个普通周日，图书馆几点闭馆？</text><rect x="50" y="250" width="435" height="275" rx="12" fill="#fff" stroke="#d9e1df"/><text x="80" y="295" font-size="20" fill="#b55e43" font-weight="600">助手的回答</text><text x="80" y="390" font-size="68" fill="#b55e43" font-weight="600">18:00</text><text x="80" y="454" font-size="21" fill="#617980" font-weight="400">看起来很确定</text><rect x="515" y="250" width="435" height="275" rx="12" fill="#fff" stroke="#d9e1df"/><text x="545" y="295" font-size="20" fill="#176e73" font-weight="600">现行通知 · 周日</text><text x="545" y="390" font-size="68" fill="#176e73" font-weight="600">16:00</text><text x="545" y="454" font-size="21" fill="#617980" font-weight="400">却与当前材料不同</text><text x="50" y="594" font-size="15" fill="#617980" font-weight="400">教学虚构 · 原创示意图 · 非产品界面截图</text><text x="893" y="594" font-size="15" fill="#176e73" font-weight="400">01 / 04</text></g></svg>