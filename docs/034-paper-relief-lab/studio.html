<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叙事工坊 · 故事介绍页制作台</title><link rel="stylesheet" href="studio/studio.css"><script src="studio/story-core.js" defer></script><script src="studio/exports.js" defer></script><script src="studio/studio.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="studio.html"><span class="mark">叙</span><span>叙事工坊<small>STORY DESK</small></span></a><span class="tag">从一件事，讲到一个结果。</span><div class="top-actions"><a href="story.html" target="_blank" rel="noopener">原始故事 ↗</a><a href="index.html">研究资料 ↗</a></div></header>
<section class="project-bar"><label class="project-label" for="project">正在制作<select id="project" disabled><option>正在读取故事…</option></select></label><span id="save-status" role="status">读取中</span><div class="project-actions"><button id="save" disabled>保存草稿</button><button id="export-config" disabled>导出配置</button><label class="file-button" tabindex="0" role="button">导入配置<input id="import-config" type="file" accept=".json,application/json" hidden></label></div></section>
<main class="workspace" id="workspace" aria-busy="true">
  <aside class="panel outline"><div class="panel-heading"><h1>故事分幕</h1><span id="beat-count"></span></div><div id="beat-list" class="beat-list"></div><button id="add-beat" class="add-button" disabled>＋ 添加一幕</button><details class="story-settings"><summary>整篇故事设置</summary><div id="story-form"><label>故事标题<input id="story-title" maxlength="80" data-story="title"></label><label>开场介绍<textarea id="story-subtitle" rows="3" maxlength="2000" data-story="subtitle"></textarea></label><label>读者 / 用途<input id="story-audience" maxlength="2000" data-story="audience"></label><label>主题<select id="story-theme" data-story="theme"><option value="paper">纸墨 · 暖纸与彩墨</option><option value="editorial">清晰 · 图解与证据</option></select></label><label>封面主图<select id="cover-beat" data-story="coverBeat"></select></label><label>结尾<textarea id="story-ending" rows="3" maxlength="2000" data-story="ending"></textarea></label></div></details><p class="local-note">修改仅保存在本机浏览器。导出配置或网页包，可保留一份独立副本。</p></aside>
  <section class="panel editor"><div class="panel-heading"><div><span class="eyebrow" id="editing-number">编辑分幕</span><h2 id="editing-title">文字与图稿</h2></div><button id="restore-beat" class="quiet" disabled>恢复此幕</button></div><form id="beat-form" autocomplete="off"><label>这一幕的标题<input id="beat-title" data-beat="title" maxlength="120"></label><label>正文<textarea id="beat-narration" data-beat="narration" rows="6" maxlength="6000" placeholder="发生了什么？空行可分段。"></textarea></label><label>对话 / 重点句<textarea id="beat-dialogue" data-beat="dialogue" rows="2" maxlength="6000"></textarea></label><label>画面下的短句<input id="beat-caption" data-beat="caption" maxlength="6000"></label><div class="art-label"><label for="image-file">这一幕的图稿</label><span id="image-info"></span></div><img id="art-preview" class="art-preview" alt="当前分幕图稿"><div class="art-actions"><label class="file-button primary" tabindex="0" role="button">替换图稿<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><span>PNG、JPEG、WebP · 最大 10 MB · 最长边适配至 2400px</span></div><label>图片描述<textarea id="beat-alt" data-beat="alt" rows="2" maxlength="6000" placeholder="描述姿态、事件与主要物件。"></textarea></label><details><summary>叙事目的与功能入口</summary><label>这一幕让读者理解什么<textarea id="beat-purpose" data-beat="purpose" rows="2" maxlength="6000"></textarea></label><label>入口文案<input id="action-label" maxlength="100"></label><label>入口网址<input id="action-href" type="url" placeholder="https://… 或本机产品地址" maxlength="1000"></label><p class="field-note">留空则不显示。产品入口需要对应网站处于可访问状态。</p></details><div class="order-actions"><button type="button" id="move-up">↑ 前移</button><button type="button" id="move-down">↓ 后移</button><button type="button" id="remove-beat" class="danger">删除此幕</button></div></form></section>
  <section class="panel preview-panel"><div class="panel-heading"><h2>阅读预览</h2><div class="preview-tools"><button id="preview-desktop" aria-pressed="true">自适应</button><button id="preview-mobile" aria-pressed="false">手机</button><button id="open-preview">整篇查看 ↗</button></div></div><div class="preview-stage" id="preview-stage"><iframe id="preview" title="故事实时阅读预览" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div><div class="export-bar"><div><strong>把故事带走</strong><span>图片内嵌 · 静态 · 离线可读</span></div><button id="export-web" disabled>网页包 ZIP</button><button id="export-cover" disabled>封面 PNG</button><button id="export-long" disabled>长图 PNG</button></div></section>
</main>
<div id="message" role="status" hidden></div>
<dialog id="reader-dialog"><button id="close-reader" class="close-button">关闭预览 ×</button><iframe id="full-preview" title="整篇故事预览" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></dialog>
<dialog id="export-dialog"><div class="dialog-heading"><div><span class="eyebrow">导出结果</span><h2 id="export-title"></h2></div><button id="close-export">关闭 ×</button></div><p id="export-description"></p><img id="export-image" alt="本次导出图片预览" hidden><div class="download-row"><a id="download" class="file-button primary" download>保存文件 ↓</a><a id="download-html" class="file-button" download hidden>单文件 HTML ↓</a></div><p class="field-note">文件已生成；如浏览器未自动保存，请使用上面的保存链接。</p></dialog>
<div id="loading" class="loading">正在准备两份故事…</div>
</body></html>
