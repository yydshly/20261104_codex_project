<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2160" viewBox="0 0 1440 2160" role="img" aria-labelledby="title desc"><title id="title">43 先验证用户想要怎样的视频回应 · 研究总结图</title><desc id="desc">研究源、内容方法、原作效果、对小柚的价值、待验证项和下一步。未生成小柚样片。</desc>
<style>text{font-family:"Microsoft YaHei","Microsoft YaHei UI",sans-serif}a:hover text{text-decoration:underline}</style>
<rect x="0" y="0" width="1440" height="2160" rx="0" fill="#f2f3ec" stroke="none"/>
<rect x="0" y="0" width="1440" height="290" rx="0" fill="#183e35" stroke="none"/>
<text x="72" y="66" font-size="23" fill="#bdd4c5" font-weight="400">小柚创作研究  /  单条总结</text>
<text x="1260" y="102" font-size="82" fill="#729783" font-weight="700">43</text>
<text x="72" y="143" font-size="58" fill="#ffffff" font-weight="700">先验证用户想要怎样的视频回应</text>
<text x="72" y="193" font-size="25" fill="#c9dbd1" font-weight="400">App 增长案例的五类机会</text>
<text x="72" y="252" font-size="32" fill="#f4dfaa" font-weight="600">先测小柚在哪些对话里值得用视频，再决定每轮是否都生成。</text>
<rect x="64" y="318" width="1312" height="184" rx="22" fill="#ffffff" stroke="#d8e1d5"/>
<text x="88" y="364" font-size="24" fill="#2c6655" font-weight="700">01</text><text x="140" y="364" font-size="32" fill="#183e35" font-weight="700">研究源</text>
<text x="88" y="412" font-size="30" fill="#183e35" font-weight="600">@stringers_cn 原帖 ＋ 第32条受众讨论筛选</text>
<text x="88" y="454" font-size="25" fill="#61756d" font-weight="400">原帖只有文字。模块展示原文入口和摘要。</text>
<rect x="64" y="526" width="1312" height="300" rx="22" fill="#ffffff" stroke="#d8e1d5"/>
<text x="88" y="574" font-size="24" fill="#2c6655" font-weight="700">02</text><text x="140" y="574" font-size="32" fill="#183e35" font-weight="700">研究内容与方法</text>
<text x="88" y="619" font-size="26" fill="#61756d" font-weight="400">五类打法是给机会找触发条件。小柚最接近新技术让角色聊天可以用视频回应这一类。</text>
<rect x="88" y="644" width="392" height="112" rx="22" fill="#eaf1e5" stroke="none"/>
<text x="106" y="681" font-size="29" fill="#2c6655" font-weight="700">写下窗口</text>
<text x="106" y="714" font-size="24" fill="#183e35" font-weight="400">技术让回应方式变了</text><text x="106" y="744" font-size="24" fill="#183e35" font-weight="400">还需对需求取证</text>
<text x="490" y="706" font-size="30" fill="#2c6655" font-weight="700">→</text>
<rect x="524" y="644" width="392" height="112" rx="22" fill="#eaf1e5" stroke="none"/>
<text x="542" y="681" font-size="29" fill="#2c6655" font-weight="700">小样做对照</text>
<text x="542" y="714" font-size="24" fill="#183e35" font-weight="400">文本、预录、现生成</text><text x="542" y="744" font-size="24" fill="#183e35" font-weight="400">回答内容保持匹配</text>
<text x="926" y="706" font-size="30" fill="#2c6655" font-weight="700">→</text>
<rect x="960" y="644" width="392" height="112" rx="22" fill="#eaf1e5" stroke="none"/>
<text x="978" y="681" font-size="29" fill="#2c6655" font-weight="700">记录愿不愿续聊</text>
<text x="978" y="714" font-size="24" fill="#183e35" font-weight="400">首帧、退出、再回一轮</text><text x="978" y="744" font-size="24" fill="#183e35" font-weight="400">同时记每轮成功成本</text>
<text x="88" y="796" font-size="23" fill="#61756d" font-weight="400">小柚的验证方案依据原作观察与公开资料整理。</text>
<rect x="64" y="850" width="1312" height="560" rx="22" fill="#ffffff" stroke="#d8e1d5"/>
<text x="88" y="900" font-size="24" fill="#2c6655" font-weight="700">03</text><text x="140" y="900" font-size="32" fill="#183e35" font-weight="700">原作展示的效果</text>
<rect x="88" y="924" width="580" height="420" rx="14" fill="#eaf1e5" stroke="none"/>
<text x="124" y="999" font-size="36" fill="#2c6655" font-weight="700">原帖要点</text>
<text x="124" y="1076" font-size="25" fill="#183e35" font-weight="400">跨市场复制与本地化</text><text x="124" y="1125" font-size="25" fill="#183e35" font-weight="400">先建触达渠道再做产品</text><text x="124" y="1174" font-size="25" fill="#183e35" font-weight="400">新技术、规则变化</text><text x="124" y="1223" font-size="25" fill="#183e35" font-weight="400">老产品退出后的迁移需求</text>
<text x="708" y="962" font-size="30" fill="#2c6655" font-weight="700">可核对的原作表现</text>
<text x="708" y="1069" font-size="22" fill="#7a967b" font-weight="700">01</text>
<text x="756" y="1069" font-size="25" fill="#183e35" font-weight="400">原帖归纳了五类机会。</text>
<text x="708" y="1163" font-size="22" fill="#7a967b" font-weight="700">02</text>
<text x="756" y="1163" font-size="25" fill="#183e35" font-weight="400">视频回话案例有规模说法。</text>
<text x="708" y="1257" font-size="22" fill="#7a967b" font-weight="700">03</text>
<text x="756" y="1257" font-size="25" fill="#183e35" font-weight="400">来源未提供 App 名与可复查榜单。</text>
<text x="88" y="1381" font-size="21" fill="#61756d" font-weight="400">文字原帖 · 无图片或视频附件</text>
<text x="708" y="1342" font-size="20" fill="#61756d" font-weight="400">以下小柚用法需要用自己的素材验证。</text>
<rect x="64" y="1434" width="1312" height="264" rx="22" fill="#deebdc" stroke="none"/>
<text x="88" y="1484" font-size="24" fill="#2c6655" font-weight="700">04</text><text x="140" y="1484" font-size="32" fill="#183e35" font-weight="700">对小柚的价值</text>
<text x="1230" y="1484" font-size="22" fill="#61756d" font-weight="400">待实测兑现</text>
<text x="88" y="1541" font-size="29" fill="#2c6655" font-weight="700">验证视频陪伴</text>
<text x="88" y="1590" font-size="25" fill="#183e35" font-weight="400">对照文字和视频回应</text><text x="88" y="1630" font-size="25" fill="#183e35" font-weight="400">找改善感受的场景</text>
<text x="524" y="1541" font-size="29" fill="#2c6655" font-weight="700">避免每次都重生成</text>
<text x="524" y="1590" font-size="25" fill="#183e35" font-weight="400">有库存反应用已验片</text><text x="524" y="1630" font-size="25" fill="#183e35" font-weight="400">个性回应单独测</text>
<text x="960" y="1541" font-size="29" fill="#2c6655" font-weight="700">看持久互动</text>
<text x="960" y="1590" font-size="25" fill="#183e35" font-weight="400">量继续聊和等待退出</text><text x="960" y="1630" font-size="25" fill="#183e35" font-weight="400">分开算生成成本</text>
<rect x="64" y="1722" width="1312" height="172" rx="22" fill="#f6ecd8" stroke="#e7d7b6"/>
<text x="88" y="1768" font-size="29" fill="#805c2c" font-weight="700">待验证 · 当前交付边界</text>
<text x="88" y="1816" font-size="26" fill="#715d41" font-weight="400">原帖样本和案例榜单未公开。未建立视频聊天服务或测得留存。</text>
<rect x="64" y="1918" width="1312" height="144" rx="22" fill="#183e35" stroke="none"/>
<text x="88" y="1965" font-size="30" fill="#f4dfaa" font-weight="700">小柚试验</text>
<text x="88" y="2007" font-size="26" fill="#eff5ec" font-weight="400">用自有素材设五轮对话，给一组文字和一组预录视频，保持语义一致。</text>
