<header><div><a href="../../#13">← 返回第13条研究</a><h1>同一帧，重现同一组图层</h1><p>本项目代码原理演示；使用文字与几何素材卡。未使用作者工程、小柚图片或原曲。</p></div><span class="badge">10秒 · 30fps · 示例120 BPM · 无音频</span></header>
<div class="stage"><svg viewBox="0 0 1280 720" role="img" aria-label="可按帧定位的文字与素材卡结构预演">
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#1d4032" opacity=".1"/></pattern></defs>
<rect width="1280" height="720" fill="#f8f4e9"/><rect width="1280" height="720" fill="url(#dots)"/>
<path d="M70 112H1210 M70 614H1210" stroke="#234a3e" stroke-width="2"/><text x="72" y="76" fill="#315b4b" font-size="21">小柚 / 时间线结构预演</text><text id="stage-frame" x="1070" y="76" fill="#315b4b" font-size="21">F000</text>
<g id="rings" transform="translate(1000 260)"><circle r="140" fill="none" stroke="#d87969" stroke-width="18"/><circle r="100" fill="none" stroke="#2f6e56" stroke-width="2"/><circle r="57" fill="#e3bd57"/></g>
<g id="cards"><g id="card0"><rect width="260" height="230" rx="18" fill="#2f6e56"/><path d="M28 45H232M28 65H170" stroke="white" stroke-width="5" opacity=".5"/><text x="130" y="150" text-anchor="middle" fill="white" font-size="36">素材 A</text></g><g id="card1"><rect width="260" height="230" rx="18" fill="#d87969"/><text x="130" y="150" text-anchor="middle" fill="#173d34" font-size="36">素材 B</text></g><g id="card2"><rect width="260" height="230" rx="18" fill="#e3bd57"/><text x="130" y="150" text-anchor="middle" fill="#173d34" font-size="36">素材 C</text></g></g>
<g id="words"><text id="headline" x="72" y="495" fill="#173d34" font-weight="700" font-size="66">小柚 · 灵感开场</text><text id="line" x="76" y="557" fill="#315b4b" font-size="30">一张素材，也能组织节奏</text></g>
<g id="beats"><circle cx="82" cy="656" r="8"/><circle cx="112" cy="656" r="8"/><circle cx="142" cy="656" r="8"/><circle cx="172" cy="656" r="8"/></g><text id="stage-state" x="222" y="663" fill="#315b4b" font-size="21">引入 · 示例第1拍</text><text x="840" y="663" fill="#617369" font-size="18">非原片复现 / 无人物与音频验收</text>
</svg></div>
<section class="controls" aria-label="时间线控制">
<div class="row"><button type="button" id="play">播放结构预演</button><output id="readout" aria-live="off"></output><label>当前帧 <input id="frame-number" type="number" min="0" max="299" step="1" value="0"></label><button type="button" data-frame="0">起点 F0</button><button type="button" data-frame="90">展开 F90</button><button type="button" data-frame="210">收束 F210</button><button type="button" data-frame="299">末帧 F299</button></div>
<label for="frame">逐帧查看</label><input id="frame" type="range" min="0" max="299" step="1" value="0">
<div class="row"><label>主标题 <input id="title-input" type="text" maxlength="16" value="小柚 · 灵感开场"></label><label for="palette">配色</label><select id="palette"><option value="green">薄荷 / 珊瑚</option><option value="pop">蓝 / 洋红</option></select></div>
</section><div class="notes"><p><strong>可以确认：</strong>0–89帧引入、90–209帧展开、210–299帧收束；同一帧与同一文字/配色输入会得到相同布局。</p><p><strong>仍需另验：</strong>真实音乐拍点、人物身份、音画同步、导出视频与实际制作耗时。本页不生成MP4，也没有原曲。</p></div>
<p class="hint">示例节拍每15帧一次（120 BPM × 30fps），不是原片BPM。可修改标题与配色，观察时间结构保留；布局规则保存在本地代码中。</p>
