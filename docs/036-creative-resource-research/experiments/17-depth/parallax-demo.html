<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>17 分层运动原理示意</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f0f3eb;color:#183e35;font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:28px}h1{margin:0;font-size:30px}p{margin:10px 0 20px}.tag{font-size:13px;color:#61756d}.controls{background:white;border:1px solid #d9e1d4;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}input{flex:1;min-width:180px;accent-color:#2c6655}button{border:1px solid #9cb5a0;background:#fff;border-radius:9px;padding:8px 14px;color:#183e35;cursor:pointer}button:hover{background:#e9f1e3}button:focus-visible,input:focus-visible{outline:3px solid #9d763d;outline-offset:3px}output{font-weight:bold;min-width:58px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}.panel{background:white;border:1px solid #d9e1d4;border-radius:18px;overflow:hidden}h2{font-size:21px;margin:16px 20px 8px}svg{width:100%;height:auto;display:block}small{display:block;color:#61756d;margin:12px 20px 18px}.readout{padding:0 20px 18px;font-variant-numeric:tabular-nums}.note{border-left:4px solid #ba975f;background:#faf4e5;padding:14px 18px}.legend{display:flex;gap:22px;font-size:14px;margin-top:8px}.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:7px;background:var(--c)}a{color:#2c6655}@media(max-width:720px){main{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:25px}}</style>
<main><div class="tag">小柚研究 / 第17条 / 本项目自写原理示意</div><h1>拖动视点，看分层运动怎样形成空间感</h1><p>两边使用同一组平面图形。左边整体移动；右边让前、中、背景按不同幅度移动。观察拱门、卡片与远景的相对位置。</p>
<div class="controls"><label for="view">视点水平位置</label><input id="view" type="range" min="-120" max="120" step="10" value="0"><output id="value" for="view">0</output><button id="left">向左</button><button id="reset">居中</button><button id="right">向右</button></div>
<div class="legend"><span style="--c:#91afa5">背景</span><span style="--c:#e0c082">中景</span><span style="--c:#315e53">前景</span></div><div class="grid" id="panels"></div>
<div class="note"><strong>这个示意能说明什么？</strong>有限运镜可以利用图层相对移动增加深度感。它没有生成完整物体或被遮挡的背面；大幅绕拍仍需要额外资产或真实几何。<br>数字是示意位移，不是真实场景测量。本轮未生成小柚画面、配音或MP4，也未复现作者工具。</div><p><a href="../../#17">返回第17条研究模块</a></p></main>
<script>
const panel=document.querySelector('#panels');
function scene(mode,title,description){return '<section class="panel" data-mode="'+mode+'"><h2>'+title+'</h2><svg viewBox="0 0 600 380" role="img" aria-label="'+title+'：远景、卡片和前景拱门"><defs><clipPath id="clip-'+mode+'"><rect width="600" height="380"/></clipPath></defs><g clip-path="url(#clip-'+mode+')"><rect width="600" height="380" fill="#dfe8de"/><g data-layer="far"><circle cx="440" cy="96" r="38" fill="#f4e6b9"/><path d="M-180 255L20 80 150 215 285 110 440 240 585 130 780 255V400H-180Z" fill="#91afa5"/><path d="M-180 270L100 180 270 290 465 200 780 280V400H-180Z" fill="#78988c"/></g><g data-layer="middle"><path d="M100 316H500V338H100Z" fill="#ac966b"/><rect x="150" y="170" width="82" height="145" rx="10" fill="#e0c082"/><rect x="260" y="140" width="82" height="175" rx="10" fill="#e0c082"/><rect x="370" y="192" width="82" height="123" rx="10" fill="#e0c082"/><path d="M170 195h42m-42 20h42m68-50h42m-42 20h42m68 32h42m-42 20h42" stroke="#6e6a4f" stroke-width="6"/></g><g data-layer="near" fill="#315e53"><path d="M-220-60H820V440H548V170C548 18 52 18 52 170V440H-220Z" fill-rule="evenodd"/><path d="M-180 350H780V440H-180Z"/></g></g></svg><small>'+description+'</small><div class="readout" aria-live="polite"></div></section>'}
panel.innerHTML=scene('flat','二维整体移动','前、中、背景保持同样的相对位置。')+scene('depth','2.5D分层移动','近景位移更大，远景位移较小；观察遮挡变化。');
const input=document.querySelector('#view'),out=document.querySelector('#value');
function draw(){const x=Number(input.value);out.value=String(x);document.querySelectorAll('.panel').forEach(p=>{const weights=p.dataset.mode==='flat'?[.6,.6,.6]:[.3,.6,1];const shifts=weights.map(w=>-x*w);p.querySelectorAll('[data-layer]').forEach((g,i)=>g.setAttribute('transform','translate('+shifts[i]+' 0)'));p.querySelector('.readout').textContent='背景 '+shifts[0]+' / 中景 '+shifts[1]+' / 前景 '+shifts[2]+'（示意位移）';});}
input.addEventListener('input',draw);document.querySelector('#left').addEventListener('click',()=>{input.value='-120';draw()});document.querySelector('#right').addEventListener('click',()=>{input.value='120';draw()});document.querySelector('#reset').addEventListener('click',()=>{input.value='0';draw()});draw();
</script></html>
