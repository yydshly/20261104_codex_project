        <g fill="none" stroke="#dfe9b0" stroke-width="1.3" stroke-opacity=".88">
          <path d="M139 214l-22 44H55"/><path d="M240 213l39 60h88"/>
        </g>
        <circle cx="139" cy="214" r="3" fill="#eff3bd"/><circle cx="240" cy="213" r="3" fill="#eff3bd"/>
        <rect x="24" y="253" width="111" height="34" rx="4" fill="#0e261e"/>
        <rect x="349" y="267" width="107" height="34" rx="4" fill="#0e261e"/>
        <text x="35" y="277" fill="#f2f4ce" font-size="19">保卫细胞</text>
        <text x="360" y="291" fill="#f2f4ce" font-size="19">气孔孔隙</text>
      </g>
      <text x="20" y="35" fill="#e7f0d1" font-size="18" font-weight="700" letter-spacing="2">03</text>
      <text x="0" y="355" font-size="30" font-weight="700">进一步开启</text>
      <text x="478" y="355" text-anchor="end" font-size="22" fill="#496252">孔隙明显变宽</text>
    </g>

    <path d="M56 612H1544" stroke="#b6c8b7"/>
    <rect x="56" y="640" width="1488" height="156" rx="11" fill="#193b2e"/>
    <path d="M800 665v107" stroke="#476d57"/>
    <text x="80" y="681" fill="#d1e4a1" font-size="21" font-weight="700" letter-spacing="2">先提问</text>
    <text x="80" y="731" fill="#fcf9e8" font-size="32" font-weight="700">第 03 幅中，气体从哪里进出？</text>
    <text x="80" y="767" fill="#c3d5b9" font-size="21">请在图上指出具体位置。</text>
    <text x="829" y="681" fill="#d1e4a1" font-size="21" font-weight="700" letter-spacing="2">再核对</text>
    <text x="829" y="731" fill="#fcf9e8" font-size="32" font-weight="700">沿标线找到中间的深色孔隙。</text>
    <text x="829" y="767" fill="#c3d5b9" font-size="21">它位于两侧保卫细胞之间。</text>

    <text x="56" y="844" font-size="20" fill="#435d4e">原创结构示意，未按真实尺度绘制。图中差异仅用于比较孔隙宽度。</text>
    <a href="https://doi.org/10.1038/s41598-023-34273-x">
      <text x="1544" y="844" text-anchor="end" font-size="19" fill="#405e4e">原理参考 · Scientific Reports · DOI 10.1038/s41598-023-34273-x</text>
    </a>
  </g>
