    </linearGradient>
    <radialGradient id="vignette" cx="52%" cy="45%" r="70%">
      <stop offset=".42" stop-color="#071814" stop-opacity="0"/><stop offset="1" stop-color="#071814" stop-opacity=".64"/>
    </radialGradient>
    <pattern id="grain" width="67" height="59" patternUnits="userSpaceOnUse">
