          <use href="#open-cell" transform="translate(480) scale(-1 1)" fill="url(#cell)" stroke="url(#rim)" stroke-width="3.5"/>
        </g>
        <use href="#chloroplasts" transform="translate(-23)"/><use href="#chloroplasts" transform="translate(503) scale(-1 1)" opacity=".83"/>
        <use href="#wall-glints" transform="translate(-23)"/><use href="#wall-glints" transform="translate(503) scale(-1 1)" opacity=".69"/>
        <use href="#dot-ruler"/>
