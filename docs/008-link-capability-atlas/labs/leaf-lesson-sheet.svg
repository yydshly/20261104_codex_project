      <ellipse cx="198" cy="101" rx="5.2" ry="2.5" transform="rotate(-24 198 101)"/><ellipse cx="161" cy="145" rx="5.2" ry="3" transform="rotate(-63 161 145)"/>
      <ellipse cx="160" cy="176" rx="5.5" ry="2.9" transform="rotate(60 160 176)"/><ellipse cx="167" cy="198" rx="4.5" ry="2.7" transform="rotate(53 167 198)"/>
      <ellipse cx="181" cy="220" rx="6.0" ry="3" transform="rotate(37 181 220)"/><ellipse cx="196" cy="225" rx="4.8" ry="2.5" transform="rotate(42 196 225)"/>
      <ellipse cx="174" cy="153" rx="4.2" ry="2.5" transform="rotate(-44 174 153)"/><ellipse cx="174" cy="182" rx="3.9" ry="2.2" transform="rotate(26 174 182)"/>
