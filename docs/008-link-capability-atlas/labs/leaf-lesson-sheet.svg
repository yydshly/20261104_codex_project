  <rect width="1600" height="900" fill="url(#page)"/>
  <path d="M0 0H1600" stroke="#163b2e" stroke-width="18"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#19382e">
    <text x="56" y="64" font-size="21" font-weight="700" letter-spacing="3">叶片观察 / 05</text>
    <text x="1544" y="64" text-anchor="end" font-size="18" letter-spacing="2">课堂观察卡 · 16:9</text>
    <text x="54" y="143" font-size="67" font-weight="700" letter-spacing="-3">看见叶片气孔的开合</text>
    <text x="58" y="190" font-size="25" fill="#476153">在同一示意比例下，沿虚线比较两侧保卫细胞之间的开口。</text>

    <g transform="translate(56 219)">
      <g clip-path="url(#glass)">
        <use href="#field-view"/>
        <g filter="url(#depth)">
          <use href="#closed-pore" fill="url(#pore)"/>
          <use href="#closed-cell" fill="url(#cell)" stroke="url(#rim)" stroke-width="3.5"/>
          <use href="#closed-cell" transform="translate(480) scale(-1 1)" fill="url(#cell)" stroke="url(#rim)" stroke-width="3.5"/>
        </g>
        <use href="#chloroplasts"/><use href="#chloroplasts" transform="translate(480) scale(-1 1)" opacity=".83"/>
        <use href="#wall-glints"/><use href="#wall-glints" transform="translate(480) scale(-1 1)" opacity=".69"/>
        <use href="#dot-ruler"/>
        <path d="M238.5 146v34m3-34v34" stroke="#eff4b4" stroke-width="1.8"/>
      </g>
      <text x="20" y="35" fill="#e7f0d1" font-size="18" font-weight="700" letter-spacing="2">01</text>
      <text x="0" y="355" font-size="30" font-weight="700">闭合</text>
      <text x="478" y="355" text-anchor="end" font-size="22" fill="#496252">几乎看不到缝隙</text>
    </g>

    <g transform="translate(560 219)">
      <g clip-path="url(#glass)">
        <use href="#field-view"/>
        <g filter="url(#depth)">
          <use href="#middle-pore" fill="url(#pore)"/>
          <use href="#middle-cell" fill="url(#cell)" stroke="url(#rim)" stroke-width="3.5"/>
          <use href="#middle-cell" transform="translate(480) scale(-1 1)" fill="url(#cell)" stroke="url(#rim)" stroke-width="3.5"/>
        </g>
        <use href="#chloroplasts" transform="translate(-7)"/><use href="#chloroplasts" transform="translate(487) scale(-1 1)" opacity=".83"/>
        <use href="#wall-glints" transform="translate(-7)"/><use href="#wall-glints" transform="translate(487) scale(-1 1)" opacity=".69"/>
        <use href="#dot-ruler"/>
        <path d="M211 154v18m0-9h58m0-9v18" stroke="#f4f2af" stroke-width="2.5" fill="none"/>
      </g>
      <text x="20" y="35" fill="#e7f0d1" font-size="18" font-weight="700" letter-spacing="2">02</text>
      <text x="0" y="355" font-size="30" font-weight="700">开始开启</text>
      <text x="478" y="355" text-anchor="end" font-size="22" fill="#496252">中间出现窄缝</text>
    </g>

    <g transform="translate(1064 219)">
