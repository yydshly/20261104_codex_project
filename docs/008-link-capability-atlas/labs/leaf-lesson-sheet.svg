<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">看见叶片气孔的开合</title>
  <desc id="description">课堂观察卡。在同一示意比例下对照气孔闭合、开始开启和进一步开启三种状态。虚线标出同一观察位置，深色缝隙位于两侧保卫细胞之间。形态未按真实尺度绘制。</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f8f8ec"/><stop offset="1" stop-color="#e8eddd"/>
    </linearGradient>
    <radialGradient id="field" cx="51%" cy="49%" r="72%">
      <stop stop-color="#294e3b"/><stop offset=".61" stop-color="#193a30"/><stop offset="1" stop-color="#0c231e"/>
    </radialGradient>
    <radialGradient id="cell" cx="37%" cy="29%" r="76%">
      <stop stop-color="#a3c66e"/><stop offset=".32" stop-color="#76ab5e"/><stop offset=".72" stop-color="#4e8955"/><stop offset="1" stop-color="#245d44"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#e3eaa4"/><stop offset=".45" stop-color="#a8ce81"/><stop offset="1" stop-color="#467a5c"/>
    </linearGradient>
    <linearGradient id="pore" x1="0" x2="1" y1="0" y2="0">
