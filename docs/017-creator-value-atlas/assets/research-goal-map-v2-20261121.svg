<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="5384" viewBox="0 0 3600 5384" role="img" aria-labelledby="t de">
<title id="t">创作者情报产品研究：目标、成果与缺口关系图</title>
<desc id="de">从用户最初的问题梳理平台、领域、作者与作品的组织框架，说明独立游戏样板如何验证资料用途，并区分已有学习经验资料与待补的推广合作信息。</desc>
<rect width="100%" height="100%" fill="#f2f5f0"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="3600" height="455" rx="0" fill="#203d37"/>
<text x="110" y="81.92" font-size="34" fill="#c9dfc7" font-weight="700">重新对齐研究目标  /  观源 · 2026.11.21</text>
<text x="110" y="199.04000000000002" font-size="83" fill="#ffffff" font-weight="700">把平台、领域和博主整理好，能成为有价值的产品吗？</text>
<text x="110" y="304.6" font-size="45" fill="#e1ece4" font-weight="400">我们要让使用者知道：去哪里找、找谁、看什么、为什么值得，</text>
<text x="110" y="372.6" font-size="45" fill="#e1ece4" font-weight="400">以及怎样把这些信息用于学习、研究、推广或合作。</text>
<rect x="110" y="503" width="3380" height="155" rx="24" fill="#dfeade"/>
<text x="145" y="572.76" font-size="52" fill="#203d37" font-weight="700">独立游戏 = 第一个深入研究的领域样板</text>
<text x="145" y="636.68" font-size="36" fill="#576b62" font-weight="400">它用来检验“整理方法能否帮助具体任务”；游戏制作与发行计划，是这个样板里的应用延伸。</text>
<text x="110" y="735.28" font-size="31" fill="#2f6955" font-weight="700">01</text>
<text x="205" y="752.04" font-size="58" fill="#203d37" font-weight="700">你的问题，怎样一步步变成我们的研究</text>
<text x="205" y="820.8" font-size="35" fill="#576b62" font-weight="400">保留问题之间的关系，说明每次扩展是在回答什么。</text>
<rect x="110.0" y="875" width="648.8" height="330" rx="22" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="137.0" y="923.52" font-size="29" fill="#2f6955" font-weight="700">你先问</text>
<text x="137.0" y="989.96" font-size="42" fill="#203d37" font-weight="700">Monid 与博主采集</text>
<text x="137.0" y="1058.92" font-size="34" fill="#576b62" font-weight="400">由此引出：采集到的信息，怎样经过整</text>
<text x="137.0" y="1108.92" font-size="34" fill="#576b62" font-weight="400">理形成价值？</text>
<line x1="763.8" y1="1040.0" x2="787.8" y2="1040.0" stroke="#2f6955" stroke-width="5"/>
<line x1="787.8" y1="1040.0" x2="774.8" y2="1028.0" stroke="#2f6955" stroke-width="5"/>
<line x1="787.8" y1="1040.0" x2="774.8" y2="1052.0" stroke="#2f6955" stroke-width="5"/>
<rect x="792.8" y="875" width="648.8" height="330" rx="22" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="819.8" y="923.52" font-size="29" fill="#2f6955" font-weight="700">接着问</text>
<text x="819.8" y="989.96" font-size="42" fill="#203d37" font-weight="700">这种产品有没有价值</text>
<text x="819.8" y="1058.92" font-size="34" fill="#576b62" font-weight="400">研究用途、筛选依据，以及整理成果能</text>
<text x="819.8" y="1108.92" font-size="34" fill="#576b62" font-weight="400">否帮助别人。</text>
<line x1="1446.6" y1="1040.0" x2="1470.6" y2="1040.0" stroke="#2f6955" stroke-width="5"/>
<line x1="1470.6" y1="1040.0" x2="1457.6" y2="1028.0" stroke="#2f6955" stroke-width="5"/>
<line x1="1470.6" y1="1040.0" x2="1457.6" y2="1052.0" stroke="#2f6955" stroke-width="5"/>
<rect x="1475.6" y="875" width="648.8" height="330" rx="22" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="1502.6" y="923.52" font-size="29" fill="#2f6955" font-weight="700">然后提出</text>
<text x="1502.6" y="989.96" font-size="42" fill="#203d37" font-weight="700">平台 × 领域 × 博主</text>
<text x="1502.6" y="1058.92" font-size="34" fill="#576b62" font-weight="400">形成信息组织框架：在哪里、哪个方向</text>
<text x="1502.6" y="1108.92" font-size="34" fill="#576b62" font-weight="400">、谁有相关作品。</text>
<line x1="2129.3999999999996" y1="1040.0" x2="2153.3999999999996" y2="1040.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2153.3999999999996" y1="1040.0" x2="2140.3999999999996" y2="1028.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2153.3999999999996" y1="1040.0" x2="2140.3999999999996" y2="1052.0" stroke="#2f6955" stroke-width="5"/>
<rect x="2158.3999999999996" y="875" width="648.8" height="330" rx="22" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="2185.3999999999996" y="923.52" font-size="29" fill="#2f6955" font-weight="700">再选样板</text>
<text x="2185.3999999999996" y="989.96" font-size="42" fill="#203d37" font-weight="700">先把独立游戏做深</text>
<text x="2185.3999999999996" y="1058.92" font-size="34" fill="#576b62" font-weight="400">加入大作者、小众专业作者、中文资料</text>
<text x="2185.3999999999996" y="1108.92" font-size="34" fill="#576b62" font-weight="400">与学习顺序。</text>
<line x1="2812.2" y1="1040.0" x2="2836.2" y2="1040.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2836.2" y1="1040.0" x2="2823.2" y2="1028.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2836.2" y1="1040.0" x2="2823.2" y2="1052.0" stroke="#2f6955" stroke-width="5"/>
<rect x="2841.2" y="875" width="648.8" height="330" rx="22" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="2868.2" y="923.52" font-size="29" fill="#2f6955" font-weight="700">最后做应用</text>
<text x="2868.2" y="989.96" font-size="42" fill="#203d37" font-weight="700">发行复盘、对比和计划</text>
<text x="2868.2" y="1058.92" font-size="34" fill="#576b62" font-weight="400">检验作者经验能否变成决策材料和可执</text>
<text x="2868.2" y="1108.92" font-size="34" fill="#576b62" font-weight="400">行任务。</text>
<text x="110" y="1277.28" font-size="31" fill="#2f6955" font-weight="700">02</text>
<text x="205" y="1294.04" font-size="58" fill="#203d37" font-weight="700">研究骨架：信息经过什么处理，才对使用者有用</text>
<rect x="110.0" y="1350" width="648.8" height="220" rx="22" fill="#dfeade"/>
<text x="135.0" y="1412.84" font-size="43" fill="#203d37" font-weight="700">平台入口</text>
<text x="135.0" y="1482.8" font-size="35" fill="#203d37" font-weight="400">哪里更容易找到目标内容</text>
<line x1="763.8" y1="1460.0" x2="787.8" y2="1460.0" stroke="#2f6955" stroke-width="5"/>
<line x1="787.8" y1="1460.0" x2="774.8" y2="1448.0" stroke="#2f6955" stroke-width="5"/>
<line x1="787.8" y1="1460.0" x2="774.8" y2="1472.0" stroke="#2f6955" stroke-width="5"/>
<rect x="792.8" y="1350" width="648.8" height="220" rx="22" fill="#dfeade"/>
<text x="817.8" y="1412.84" font-size="43" fill="#203d37" font-weight="700">细分领域</text>
<text x="817.8" y="1482.8" font-size="35" fill="#203d37" font-weight="400">把宽泛兴趣拆成具体问题</text>
<line x1="1446.6" y1="1460.0" x2="1470.6" y2="1460.0" stroke="#2f6955" stroke-width="5"/>
<line x1="1470.6" y1="1460.0" x2="1457.6" y2="1448.0" stroke="#2f6955" stroke-width="5"/>
<line x1="1470.6" y1="1460.0" x2="1457.6" y2="1472.0" stroke="#2f6955" stroke-width="5"/>
<rect x="1475.6" y="1350" width="648.8" height="220" rx="22" fill="#dfeade"/>
<text x="1500.6" y="1412.84" font-size="43" fill="#203d37" font-weight="700">作者与代表作</text>
<text x="1500.6" y="1482.8" font-size="35" fill="#203d37" font-weight="400">谁做过、哪份资料能证明</text>
<line x1="2129.3999999999996" y1="1460.0" x2="2153.3999999999996" y2="1460.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2153.3999999999996" y1="1460.0" x2="2140.3999999999996" y2="1448.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2153.3999999999996" y1="1460.0" x2="2140.3999999999996" y2="1472.0" stroke="#2f6955" stroke-width="5"/>
<rect x="2158.3999999999996" y="1350" width="648.8" height="220" rx="22" fill="#dfeade"/>
<text x="2183.3999999999996" y="1412.84" font-size="43" fill="#203d37" font-weight="700">价值与适用条件</text>
<text x="2183.3999999999996" y="1482.8" font-size="35" fill="#203d37" font-weight="400">擅长什么、为什么值得看</text>
<line x1="2812.2" y1="1460.0" x2="2836.2" y2="1460.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2836.2" y1="1460.0" x2="2823.2" y2="1448.0" stroke="#2f6955" stroke-width="5"/>
<line x1="2836.2" y1="1460.0" x2="2823.2" y2="1472.0" stroke="#2f6955" stroke-width="5"/>
<rect x="2841.2" y="1350" width="648.8" height="220" rx="22" fill="#dfeade"/>
<text x="2866.2" y="1412.84" font-size="43" fill="#203d37" font-weight="700">按任务交付</text>
<text x="2866.2" y="1482.8" font-size="35" fill="#203d37" font-weight="400">给出候选、理由和使用顺序</text>
<text x="110" y="1629.68" font-size="36" fill="#576b62" font-weight="400">判断原则：体量、专业程度、受众匹配、合作效果分别看证据；大作者也可能很垂直，小作者也可能跨主题。</text>
<text x="110" y="1683.68" font-size="36" fill="#576b62" font-weight="400">Monid 等工具位于采集环节；分类、作品核对、用途判断、更新和使用反馈，构成后续整理工作。</text>
<text x="110" y="1770.28" font-size="31" fill="#2f6955" font-weight="700">03</text>
<text x="205" y="1787.04" font-size="58" fill="#203d37" font-weight="700">我们已经做的内容，分别与目标有什么关联</text>
<text x="205" y="1855.8" font-size="35" fill="#576b62" font-weight="400">研究资料并不是并列堆积；每一层都要回答一个使用问题。</text>
<rect x="110.0" y="1910" width="1104.0" height="608" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="148.0" y="1969.52" font-size="29" fill="#2f6955" font-weight="700">第一层 · 发现</text>
<text x="148.0" y="2032.48" font-size="46" fill="#203d37" font-weight="700">“去哪里找？”</text>
<text x="148.0" y="2112.32" font-size="39" fill="#576b62" font-weight="400">已整理：12 个平台与分发入口、12 个一级领域。</text>
<text x="148.0" y="2192.32" font-size="39" fill="#576b62" font-weight="400">与目标的关系：为不同目的、语言和内容形式提供检索入口</text>
<text x="148.0" y="2250.32" font-size="39" fill="#576b62" font-weight="400">。</text>
<text x="148.0" y="2330.32" font-size="39" fill="#576b62" font-weight="400">当前边界：各领域深度不同，独立游戏最深入；分类不等于</text>
<text x="148.0" y="2388.32" font-size="39" fill="#576b62" font-weight="400">市场已充分覆盖。</text>
<rect x="1248.0" y="1910" width="1104.0" height="608" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="1286.0" y="1969.52" font-size="29" fill="#2f6955" font-weight="700">第二层 · 识别</text>
<text x="1286.0" y="2032.48" font-size="46" fill="#203d37" font-weight="700">“哪些人值得关注？”</text>
<text x="1286.0" y="2112.32" font-size="39" fill="#576b62" font-weight="400">已整理：全站 42 位作者样本；独立游戏 28 位，其中 12</text>
<text x="1286.0" y="2170.32" font-size="39" fill="#576b62" font-weight="400">位中文作者，配 56 份代表资料。</text>
<text x="1286.0" y="2250.32" font-size="39" fill="#576b62" font-weight="400">与目标的关系：用擅长方向、作品和出处解释关注理由，而</text>
<text x="1286.0" y="2308.32" font-size="39" fill="#576b62" font-weight="400">非只列账号。</text>
<text x="1286.0" y="2388.32" font-size="39" fill="#576b62" font-weight="400">当前边界：多数体量、受众画像和合作条件待核。</text>
<rect x="2386.0" y="1910" width="1104.0" height="608" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="2424.0" y="1969.52" font-size="29" fill="#2f6955" font-weight="700">第三层 · 使用</text>
<text x="2424.0" y="2032.48" font-size="46" fill="#203d37" font-weight="700">“找到后，怎样用？”</text>
<text x="2424.0" y="2112.32" font-size="39" fill="#576b62" font-weight="400">已整理：5 条学习路线；5 个中文发行案例的横比；单人低</text>
<text x="2424.0" y="2170.32" font-size="39" fill="#576b62" font-weight="400">预算发行模板。</text>
<text x="2424.0" y="2250.32" font-size="39" fill="#576b62" font-weight="400">与目标的关系：从作者经验提炼学习顺序、方法取舍、成本</text>
<text x="2424.0" y="2308.32" font-size="39" fill="#576b62" font-weight="400">与避坑。</text>
<text x="2424.0" y="2388.32" font-size="39" fill="#576b62" font-weight="400">当前边界：这证明已有可使用的资料组织方式，真实效果与</text>
<text x="2424.0" y="2446.32" font-size="39" fill="#576b62" font-weight="400">付费价值仍待验证。</text>
<text x="110" y="2579.28" font-size="31" fill="#2f6955" font-weight="700">04</text>
<text x="205" y="2596.04" font-size="58" fill="#203d37" font-weight="700">独立游戏样板内部，其实存在两种不同的用途</text>
<text x="205" y="2664.8" font-size="35" fill="#576b62" font-weight="400">区分用途，才能看清现有资料支持哪些任务，以及推广合作还缺什么。</text>
<rect x="110.0" y="2719" width="1673.0" height="500" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="148.0" y="2778.52" font-size="29" fill="#2f6955" font-weight="700">用途 A · 当前资料较完整</text>
<text x="148.0" y="2841.48" font-size="46" fill="#203d37" font-weight="700">学习与经验研究</text>
<text x="148.0" y="2922.2" font-size="40" fill="#576b62" font-weight="400">使用者的问题：我想学设计、做原型，或理解别人怎样发行。</text>
<text x="148.0" y="3004.2" font-size="40" fill="#576b62" font-weight="400">现有资料：GMTK、Maddy、麦扣等人的作品与教学；亚恒、夜神、叶千落、传传、蓝桃</text>
<text x="148.0" y="3064.2" font-size="40" fill="#576b62" font-weight="400">的项目复盘。</text>
<text x="148.0" y="3146.2" font-size="40" fill="#576b62" font-weight="400">交付：值得读的资料、前置知识、阅读顺序、案例条件，以及可借用的方法。</text>
<rect x="1817.0" y="2719" width="1673.0" height="500" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="1855.0" y="2778.52" font-size="29" fill="#2f6955" font-weight="700">用途 B · 尚需系统补充</text>
<text x="1855.0" y="2841.48" font-size="46" fill="#203d37" font-weight="700">推广作者发现与合作匹配</text>
<text x="1855.0" y="2922.2" font-size="40" fill="#576b62" font-weight="400">使用者的问题：我的具体游戏，适合找哪些作者介绍或传播？</text>
<text x="1855.0" y="3004.2" font-size="40" fill="#576b62" font-weight="400">需要补齐：同类型游戏评测、实况和垂直内容作者；近期作品、观众匹配、公开联系入口</text>
<text x="1855.0" y="3064.2" font-size="40" fill="#576b62" font-weight="400">与可确认的合作条件。</text>
<text x="1855.0" y="3146.2" font-size="40" fill="#576b62" font-weight="400">交付：有依据的候选名单与匹配理由，之后再通过真实沟通核实条件和效果。</text>
<rect x="110" y="3253" width="3380" height="155" rx="24" fill="#eee6d5"/>
<text x="144" y="3313.08" font-size="41" fill="#98652e" font-weight="700">当前最关键的缺口</text>
<text x="144" y="3371.68" font-size="36" fill="#203d37" font-weight="400">已收录的开发者、教程作者和发行经验作者，可以帮助我们学习与判断；尚不能据此确认“谁适合为某款游戏做推广、成本多少、效果如何”。</text>
<text x="110" y="3478.28" font-size="31" fill="#2f6955" font-weight="700">05</text>
<text x="205" y="3495.04" font-size="58" fill="#203d37" font-weight="700">用三个例子，把“资料”与“研究目的”直接连起来</text>
<rect x="110" y="3551" width="690" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="135" y="3611.68" font-size="36" fill="#203d37" font-weight="700">想学游戏手感</text>
<rect x="800" y="3551" width="1160" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="825" y="3611.68" font-size="36" fill="#576b62" font-weight="400">Maddy 的 Celeste 容错与手感资料</text>
<rect x="1960" y="3551" width="1030" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="1985" y="3611.68" font-size="36" fill="#576b62" font-weight="400">选择学习材料，回原型练习</text>
<rect x="2990" y="3551" width="500" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="3015" y="3611.68" font-size="36" fill="#576b62" font-weight="400">已有资料支持</text>
<rect x="110" y="3736" width="690" height="185" rx="0" fill="#e7eee4" stroke="#cedbcf" stroke-width="2"/>
<text x="135" y="3796.68" font-size="36" fill="#203d37" font-weight="700">想设计低预算宣发</text>
<rect x="800" y="3736" width="1160" height="185" rx="0" fill="#e7eee4" stroke="#cedbcf" stroke-width="2"/>
<text x="825" y="3796.68" font-size="36" fill="#576b62" font-weight="400">亚恒等人的真实发行复盘＋五案横比</text>
<rect x="1960" y="3736" width="1030" height="185" rx="0" fill="#e7eee4" stroke="#cedbcf" stroke-width="2"/>
<text x="1985" y="3796.68" font-size="36" fill="#576b62" font-weight="400">借用方法、分清成本，再编排计划</text>
<rect x="2990" y="3736" width="500" height="185" rx="0" fill="#e7eee4" stroke="#cedbcf" stroke-width="2"/>
<text x="3015" y="3796.68" font-size="36" fill="#576b62" font-weight="400">已有资料支持</text>
<rect x="110" y="3921" width="690" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="135" y="3981.68" font-size="36" fill="#203d37" font-weight="700">想找到适合推广新游的人</text>
<rect x="800" y="3921" width="1160" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="825" y="3981.68" font-size="36" fill="#576b62" font-weight="400">需要补同类型评测 / 实况作者及合作信息</text>
<rect x="1960" y="3921" width="1030" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="1985" y="3981.68" font-size="36" fill="#576b62" font-weight="400">先给出匹配候选，再验证合作条件</text>
<rect x="2990" y="3921" width="500" height="185" rx="0" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="3015" y="3981.68" font-size="36" fill="#576b62" font-weight="400">后续待补与验证</text>
<text x="110" y="4173.28" font-size="31" fill="#2f6955" font-weight="700">06</text>
<text x="205" y="4190.04" font-size="58" fill="#203d37" font-weight="700">方向：围绕具体用途，把创作者资料变成可验证的交付</text>
<text x="205" y="4258.8" font-size="35" fill="#576b62" font-weight="400">以下是对现有研究的方向归纳，尚未形成付费与盈利结论。</text>
<rect x="110.0" y="4313" width="1104.0" height="608" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="148.0" y="4372.52" font-size="29" fill="#2f6955" font-weight="700">产品是什么</text>
<text x="148.0" y="4435.48" font-size="46" fill="#203d37" font-weight="700">有证据、有用途的专题情报</text>
<text x="148.0" y="4515.32" font-size="39" fill="#576b62" font-weight="400">基础层：领域地图、作者与代表作、关注理由、来源和更新</text>
<text x="148.0" y="4573.32" font-size="39" fill="#576b62" font-weight="400">日期。</text>
<text x="148.0" y="4653.32" font-size="39" fill="#576b62" font-weight="400">任务层：学习资料包、研究横比，或推广合作候选及匹配理</text>
<text x="148.0" y="4711.32" font-size="39" fill="#576b62" font-weight="400">由。</text>
<text x="148.0" y="4791.32" font-size="39" fill="#576b62" font-weight="400">候选价值：减少查找与核对时间，帮助作选择；价值需要实</text>
<text x="148.0" y="4849.32" font-size="39" fill="#576b62" font-weight="400">际使用证明。</text>
<rect x="1248.0" y="4313" width="1104.0" height="608" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="1286.0" y="4372.52" font-size="29" fill="#2f6955" font-weight="700">下一步验证什么</text>
<text x="1286.0" y="4435.48" font-size="46" fill="#203d37" font-weight="700">先验证一个明确的用户任务</text>
<text x="1286.0" y="4515.32" font-size="39" fill="#576b62" font-weight="400">若服务学习：观察能否更快找到合适资料、看懂顺序、完成</text>
<text x="1286.0" y="4573.32" font-size="39" fill="#576b62" font-weight="400">练习。</text>
<text x="1286.0" y="4653.32" font-size="39" fill="#576b62" font-weight="400">若服务推广：补齐评测 / 实况作者样本，观察候选是否匹配</text>
<text x="1286.0" y="4711.32" font-size="39" fill="#576b62" font-weight="400">，合作条件能否确认。</text>
<text x="1286.0" y="4791.32" font-size="39" fill="#576b62" font-weight="400">分别记录使用结果、缺失信息、维护工时与付费意愿，避免</text>
<text x="1286.0" y="4849.32" font-size="39" fill="#576b62" font-weight="400">混用两种用途的验收标准。</text>
<rect x="2386.0" y="4313" width="1104.0" height="608" rx="24" fill="#ffffff" stroke="#cedbcf" stroke-width="2"/>
<text x="2424.0" y="4372.52" font-size="29" fill="#2f6955" font-weight="700">怎样考虑商业化</text>
<text x="2424.0" y="4435.48" font-size="46" fill="#203d37" font-weight="700">先有有效交付，再谈收费形式</text>
<text x="2424.0" y="4515.32" font-size="39" fill="#576b62" font-weight="400">候选形式：专题整理与更新、定制筛选与研究；合作条件充</text>
<text x="2424.0" y="4573.32" font-size="39" fill="#576b62" font-weight="400">分确认后，再考虑执行服务。</text>
<text x="2424.0" y="4653.32" font-size="39" fill="#576b62" font-weight="400">验证：用户是否重复使用、是否愿意付费，采集、复核、更</text>
<text x="2424.0" y="4711.32" font-size="39" fill="#576b62" font-weight="400">新与获客投入能否覆盖。</text>
<text x="2424.0" y="4791.32" font-size="39" fill="#576b62" font-weight="400">扩展：先把独立游戏样板的一个用途跑通，再复制到其他细</text>
<text x="2424.0" y="4849.32" font-size="39" fill="#576b62" font-weight="400">分领域。</text>
<rect x="110" y="4955" width="3380" height="225" rx="24" fill="#203d37"/>
<text x="146" y="5018.44" font-size="38" fill="#c9dfc7" font-weight="700">整条研究主线</text>
<text x="146" y="5097.12" font-size="49" fill="#ffffff" font-weight="700">找到信息 → 理解作者与作品 → 判断任务匹配 → 帮助选择与行动 → 验证产品价值</text>
<text x="110" y="5251.4" font-size="30" fill="#576b62" font-weight="400">资料范围：2026.11.21 项目现有网页与 109 条去重来源。作者样本并非完整市场，关注理由与路线属于编辑判断。</text>
<text x="110" y="5298.4" font-size="30" fill="#576b62" font-weight="400">本图用于说明研究目标、已有成果与缺口的关系；没有新增推广名单、商业询价、实际发信、投放或付费验证。</text>
</g></svg>